    }

    case 'busy-on':  setBusy(true); break;
    case 'busy-off': setBusy(false); break;
    case 'gym-today': logActivity('gym', 0, 0); break;

    case 'long-done': {
      const ok = await askConfirm({ title: 'Sessão longa feita?', text: 'Marcar a sessão longa da semana como concluída.', ok: 'Marcar' });
      if (ok) { currentWeek().longManual = true; afterAction(); }
      break;
    }
    case 'long-log':
      regType = 'walk'; regPrefillMin = String(currentWeek().targets.longMin);
      currentTab = 'log'; render(); window.scrollTo(0, 0); break;
    case 'goto-log':
      currentTab = 'log'; render(); window.scrollTo(0, 0); break;

    case 'reg-type':   // troca o tipo sem redesenhar (mantém o que foi digitado)
      regType = el.dataset.type;
      document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('on', b.dataset.type === regType));
      document.getElementById('reg-fields').classList.toggle('hidden', regType === 'gym');
      document.getElementById('reg-gym-info').classList.toggle('hidden', regType !== 'gym');
      break;

    case 'reg-submit': {
      const min = parseNum(document.getElementById('reg-min').value) || 0;
      const km = parseNum(document.getElementById('reg-km').value) || 0;
      if (regType !== 'gym' && !(min > 0 || km > 0)) { toast('Digite os minutos ou os km.', 'danger'); break; }
      regPrefillMin = '';
      logActivity(regType, Math.max(0, min), Math.max(0, round1(km)));
      break;
    }

    case 'cal-prev': case 'cal-next': {
      const [y, m] = calCursor.split('-').map(Number);
      const d = new Date(y, m - 1 + (act === 'cal-next' ? 1 : -1), 1);
      calCursor = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
      render(); break;
    }
    case 'cal-day':
      if (el.classList.contains('future') || el.classList.contains('before')) break;
      selDate = el.dataset.date; render(); break;

    case 'toggle-gym': case 'toggle-free': {
      const key = act === 'toggle-gym' ? 'gymDays' : 'freeDays';
      const dow = Number(el.dataset.dow);
      const arr = state.settings[key];
      state.settings[key] = arr.includes(dow) ? arr.filter(x => x !== dow) : [...arr, dow].sort();
      const wk = currentWeek();
      if (key === 'gymDays' && !wk.claimed.gym) wk.targets.gym = state.settings.gymDays.length;
      save(); render(); break;
    }

    case 'save-name': {
      const n = document.getElementById('set-name').value.trim();
      if (n) { state.player.name = n; save(); toast('Nome atualizado.', 'ok'); render(); }
      break;
    }

    case 'export': {
      const blob = new Blob([JSON.stringify({ ...state, _routes: loadRoutes() }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `sistema-backup-${dateKey()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      break;
    }
    case 'import': document.getElementById('import-file').click(); break;

    /* ----- Dungeon (GPS) ----- */
    case 'gps-type': gpsType = el.dataset.type; render(); break;
    case 'gps-autopause':
      state.settings.autoPause = state.settings.autoPause === false;
      save(); render(); break;
    case 'gps-start': startDungeon(); break;
    case 'gps-pause': if (gpsLive) pauseDungeon(); break;
    case 'gps-resume': if (gpsLive) resumeDungeon(); break;
    case 'gps-finish': await finishDungeon(); break;
    case 'gps-ap-live':
      if (!gpsLive) break;
      gpsLive.autoPause = !gpsLive.autoPause;
      if (!gpsLive.autoPause && gpsLive.status === 'autopaused') { gpsLive.status = 'running'; gpsLive.resumeAt = Date.now(); gpsLive.lastMovedAt = Date.now(); }
      saveLive(); refreshControls(); break;
    case 'gps-recenter':
      mapFollow = true; el.classList.add('hidden'); updateLiveMarker(); break;
    case 'gps-open':
      gpsView = 'detail'; gpsSel = id; gpsJustFinished = false; render(); window.scrollTo(0, 0); break;
    case 'gps-back':
      gpsView = 'home'; gpsJustFinished = false; render(); window.scrollTo(0, 0); break;
    case 'gps-delete': {
      const ok = await askConfirm({ title: 'Apagar atividade?', text: 'O mapa e os números desta dungeon serão apagados. O XP já ganho continua.', ok: 'Apagar', danger: true });
      if (!ok) break;
      state.activities = state.activities.filter(a => a.id !== id);
      const r = loadRoutes(); delete r[id]; saveRoutes(r);
      save(); gpsView = 'home'; render(); break;
    }

    case 'reset': {
      const a = await askConfirm({ title: 'Resetar progresso?', text: 'Nível, XP, atributos, sequência e histórico serão apagados.', ok: 'Continuar', danger: true });
      if (!a) break;
      const b = await askConfirm({ title: 'Tem certeza?', text: 'Isso não pode ser desfeito.', ok: 'Apagar tudo', danger: true });
      if (!b) break;
      if (gpsLive) endLiveSession();
      try { localStorage.removeItem(CONFIG.STORAGE_KEY); localStorage.removeItem(ROUTES_KEY); } catch (e) { /* ignora */ }
      state = defaultState();
      ensureToday();
      currentTab = 'home';
      render();
      showOnboarding();
      break;
    }
  }
});

/* PWA: gera o ícone num <canvas> e o manifest como Blob,
   para tudo caber num único arquivo. Se houver um sw.js ao lado
   (site em HTTPS), registra o service worker para funcionar offline. */
function setupPWA() {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const g = c.getContext('2d');
    g.fillStyle = '#03060c'; g.fillRect(0, 0, 512, 512);
    const grd = g.createRadialGradient(256, 210, 20, 256, 256, 320);
    grd.addColorStop(0, 'rgba(63,169,255,.45)'); grd.addColorStop(1, 'rgba(3,6,12,0)');
    g.fillStyle = grd; g.fillRect(0, 0, 512, 512);
    g.shadowColor = '#3fa9ff'; g.shadowBlur = 30;
    g.strokeStyle = '#5fe3ff'; g.lineWidth = 14; g.strokeRect(70, 70, 372, 372);
    g.fillStyle = '#ffffff'; g.font = '900 230px Orbitron, "Arial Black", sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('S', 256, 270);
    const png = c.toDataURL('image/png');
    document.getElementById('apple-icon').href = png;
    const base = location.href.split('#')[0].split('?')[0];
    const manifest = {
      name: 'SISTEMA — Treino', short_name: 'Sistema',
      start_url: base, scope: base.replace(/[^/]*$/, ''),
      display: 'standalone', orientation: 'portrait',
      background_color: '#03060c', theme_color: '#03060c',
      icons: [{ src: png, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }],
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    document.getElementById('manifest-link').href = URL.createObjectURL(blob);
  } catch (e) { /* sem canvas: o app funciona igual */ }

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => { /* sem sw.js: tudo bem */ });
  }
}

/* ==============================================================
   11. DUNGEON — rastreamento de corrida/caminhada por GPS
   --------------------------------------------------------------
   Fluxo: Iniciar → watchPosition → filtra leituras ruins → soma a
   distância (Haversine) → atualiza tela e mapa → salva a cada 5 s
   → Finalizar → vira um registro do dia (conta nas missões e XP).

   Onde ficam os dados:
     gpsLive  (localStorage LIVE_KEY) ... atividade em andamento
     state.activities ................... resumo das atividades finalizadas
     ROUTES_KEY ......................... rotas simplificadas (separadas para
                                          o estado principal continuar leve)

   Formato de um ponto da rota ao vivo: [lat, lng, tempoEmMovimentoMs, distânciaM]
   ============================================================== */
const LIVE_KEY = 'sistema_dungeon_live_v1';
const ROUTES_KEY = 'sistema_routes_v1';

let gpsLive = null;           // atividade em andamento (ou null)
let gpsView = 'home';         // 'home' | 'detail'
let gpsSel = null;            // id da atividade aberta no detalhe
let gpsJustFinished = false;  // detalhe aberto logo depois de finalizar
let gpsType = null;           // 'walk' | 'run' escolhido no portal
let gpsWatchId = null;
let gpsWatchStartedAt = 0;
let gpsTicker = null;
let gpsLastFix = null;        // última leitura recebida (mesmo se rejeitada): { lat, lng, acc, t }
let gpsHiddenAt = 0;
let gpsPerm = 'unknown';      // 'granted' | 'prompt' | 'denied' | 'unknown'
let gpsWarnedNoSignal = false;
let gpsSaveWarned = false;
let wakeLock = null;
let wakeState = 'off';        // 'on' | 'off' | 'unsupported'
let liveMap = null, liveLine = null, liveMarker = null, liveAcc = null, mapFollow = true;
let routeMap = null;

const PERM_HELP = 'No Android (Chrome): toque no ícone à esquerda do endereço → Permissões → Localização → Permitir. ' +
  'No iPhone: Ajustes → Privacidade → Serviços de Localização → Safari (ou o app da tela inicial) → "Ao usar o app" e ative "Localização Exata".';

/* ---------- cálculos ---------- */

// Distância em metros entre dois pontos [lat, lng] (fórmula de Haversine)
function haversine(a, b) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
}
function fmtDuration(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return h ? `${h}:${pad(m)}:${pad(x)}` : `${pad(m)}:${pad(x)}`;
}
// Ritmo em ms por km → "m:ss" (acima de 30 min/km mostra --:--)
function fmtPace(msPerKm) {
  if (!msPerKm || !isFinite(msPerKm) || msPerKm > 30 * 60000) return '--:--';
  const s = Math.round(msPerKm / 1000);
  return `${Math.floor(s / 60)}:${pad(s % 60)}`;
}
const fmtKm = m => (m / 1000).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const defaultGpsType = () => (state.player.level < 5 ? 'walk' : 'run');

/* ---------- atividade em andamento ---------- */
function newLive(type) {
  const now = Date.now();
  return {
    id: 'act-' + now, type, startedAt: now,
    status: 'running',        // 'running' | 'paused' | 'autopaused'
    waiting: true,            // true até chegar uma leitura boa (o tempo só começa aí)
    movingMs: 0,              // tempo em movimento acumulado até o último resumeAt
    resumeAt: null,           // instante em que o trecho atual começou a contar
    distance: 0,              // metros
    segments: [[]],           // cada pausa manual abre um novo trecho
    anchor: null,             // último ponto aceito [lat, lng, t]
    lastMovedAt: now,
    splits: [],               // tempo em movimento acumulado ao completar cada km
    autoPause: state.settings.autoPause !== false,
    rejected: 0, jumpStreak: 0,
  };
}

function movingNow(now = Date.now()) {
  const g = gpsLive;
  return g.movingMs + (g.status === 'running' && !g.waiting && g.resumeAt ? now - g.resumeAt : 0);
}
function curSeg() {
  const s = gpsLive.segments;
  if (!s.length) s.push([]);
  return s[s.length - 1];
}
function lastPoint() {
  const segs = gpsLive.segments;
  for (let i = segs.length - 1; i >= 0; i--) if (segs[i].length) return segs[i][segs[i].length - 1];
  return null;
}

// Guarda um ponto e calcula as parciais (interpola o instante exato de cada km)
function addRoutePoint(p, now) {
  const g = gpsLive, mov = movingNow(now), prev = lastPoint();
  while (g.distance >= (g.splits.length + 1) * 1000) {
    const target = (g.splits.length + 1) * 1000;
    if (prev && g.distance > prev[3]) {
      const f = (target - prev[3]) / (g.distance - prev[3]);
      g.splits.push(Math.round(prev[2] + f * (mov - prev[2])));
    } else g.splits.push(Math.round(mov));
  }
  curSeg().push([+p[0].toFixed(6), +p[1].toFixed(6), Math.round(mov), Math.round(g.distance)]);
}

/* Cada leitura do GPS passa por aqui.
   Filtros: precisão ruim → ignora; salto impossível → ignora;
   movimento menor que o "tremido" do GPS → considera parado. */
function onPosition(pos) {
  const c = pos.coords, now = Date.now();
  gpsLastFix = { lat: c.latitude, lng: c.longitude, acc: c.accuracy, t: now };
  gpsWarnedNoSignal = false;
  const g = gpsLive;
  if (!g) return;
  updateLiveMarker();
  if (g.status === 'paused') { updateLiveUI(); return; }
  if (c.accuracy > CONFIG.GPS.MAX_ACCURACY) { g.rejected++; updateLiveUI(); return; }

  const p = [c.latitude, c.longitude];
  if (g.waiting) {               // primeira leitura boa: o cronômetro começa agora
    g.waiting = false; g.resumeAt = now; g.lastMovedAt = now;
    refreshControls();
  }
  if (!g.anchor) {               // início de trecho: só marca a posição
    g.anchor = [p[0], p[1], now];
    addRoutePoint(p, now);
    updateLiveUI(); updateLiveMap();
    return;
  }

  const d = haversine(g.anchor, p);
  const dt = (now - g.anchor[2]) / 1000;
  if (dt <= 0) return;

  if (d / dt > CONFIG.GPS.MAX_SPEED) {           // salto impossível
    g.rejected++; g.jumpStreak++;
    if (g.jumpStreak >= CONFIG.GPS.JUMP_RESYNC) { // o GPS "pulou" e ficou lá: realinha sem somar distância
      g.jumpStreak = 0;
      g.anchor = [p[0], p[1], now];
      g.segments.push([]);
      addRoutePoint(p, now);
      updateLiveMap();
    }
    updateLiveUI();
    return;
  }
  g.jumpStreak = 0;

  if (d < Math.max(CONFIG.GPS.MIN_STEP, c.accuracy * 0.5)) { updateLiveUI(); return; } // parado / ruído

  if (g.status === 'autopaused') {               // voltou a se mexer
    g.status = 'running'; g.resumeAt = now;
    refreshControls();
    toast('Movimento detectado. Dungeon retomada.');
  }
  g.distance += d;
  g.anchor = [p[0], p[1], now];
  g.lastMovedAt = now;
  addRoutePoint(p, now);
  updateLiveUI(); updateLiveMap();
}

function onGeoError(err) {
  if (err.code === 1) {                            // PERMISSION_DENIED
    stopWatch();
    gpsPerm = 'denied';
    if (gpsLive) {
      if (!lastPoint()) endLiveSession();          // nada gravado: só cancela
      else if (gpsLive.status !== 'paused') pauseDungeon();
      render();
    }
    showGpsProblem('denied');
  } else {                                         // 2 = sem sinal, 3 = timeout
    if (gpsLive && !gpsWarnedNoSignal && err.code === 2) {
      gpsWarnedNoSignal = true;
      toast('GPS sem sinal. Vá para um lugar aberto; o Sistema continua tentando.', 'danger');
    }
    updateLiveUI();
  }
}

function startWatch() {
  stopWatch();
  try {
    gpsWatchStartedAt = Date.now();
    gpsWatchId = navigator.geolocation.watchPosition(onPosition, onGeoError,
      { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  } catch (e) { showGpsProblem('unsupported'); }
}
function stopWatch() {
  if (gpsWatchId !== null) { try { navigator.geolocation.clearWatch(gpsWatchId); } catch (e) { /* ignora */ } }
  gpsWatchId = null;
}

/* Relógio de 1 s: atualiza a tela, detecta parada (auto-pausa),
   reinicia o GPS se ele "morrer" e salva a cada 5 s. */
function startTicker() { stopTicker(); gpsTicker = setInterval(gpsTick, 1000); }
function stopTicker() { if (gpsTicker) clearInterval(gpsTicker); gpsTicker = null; }
function gpsTick() {
  const g = gpsLive;
  if (!g) { stopTicker(); return; }
  const now = Date.now();
  // Auto-pausa (nunca com o app em segundo plano: lá os timers são irregulares)
  if (g.status === 'running' && g.autoPause && !g.waiting && !document.hidden) {
    const since = Math.max(g.lastMovedAt, g.resumeAt || 0);
    if (now - since > CONFIG.GPS.AUTO_PAUSE_SEC * 1000) {
      g.movingMs += Math.max(0, since - g.resumeAt);   // a pausa vale desde que você parou
      g.status = 'autopaused'; g.resumeAt = null;
      refreshControls();
      toast('Auto-pausa: você parou.');
    }
  }
  // Watchdog: sem leitura há muito tempo → reinicia o watchPosition
  const lastT = gpsLastFix ? gpsLastFix.t : g.startedAt;
  if (g.status !== 'paused' && !document.hidden && gpsWatchId !== null &&
      now - lastT > CONFIG.GPS.STALE_FIX_MS && now - gpsWatchStartedAt > CONFIG.GPS.STALE_FIX_MS) startWatch();
  if (now - (g.savedAt || 0) > CONFIG.GPS.SAVE_EVERY_MS) saveLive();
  updateLiveUI();
}

/* ---------- Wake Lock (tela ligada) ---------- */
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) { wakeState = 'unsupported'; updateLiveUI(); return; }
  if (wakeLock || document.hidden) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeState = 'on';
    wakeLock.addEventListener('release', () => { wakeLock = null; wakeState = 'off'; updateLiveUI(); });
  } catch (e) { wakeState = 'off'; }
  updateLiveUI();
}
function releaseWakeLock() {
  try { if (wakeLock) wakeLock.release(); } catch (e) { /* ignora */ }
  wakeLock = null;
  if (wakeState !== 'unsupported') wakeState = 'off';
}

/* ---------- salvar / restaurar a atividade em andamento ---------- */
function saveLive() {
  if (!gpsLive) return;
  gpsLive.savedAt = Date.now();
  try { localStorage.setItem(LIVE_KEY, JSON.stringify(gpsLive)); }
  catch (e) {
    if (!gpsSaveWarned) { gpsSaveWarned = true; toast('Não foi possível salvar a dungeon em andamento (armazenamento cheio).', 'danger'); }
  }
}
function loadLive() {
  try {
    const g = JSON.parse(localStorage.getItem(LIVE_KEY));
    if (g && Array.isArray(g.segments)) return g;
  } catch (e) { /* ignora */ }
  return null;
}
function clearLive() {
  try { localStorage.removeItem(LIVE_KEY); } catch (e) { /* ignora */ }
  gpsLive = null;
}
// Encerra tudo da sessão ao vivo (GPS, relógio, tela, mapa)
function endLiveSession() {
  stopWatch(); stopTicker(); releaseWakeLock(); clearLive();
  if (liveMap) { try { liveMap.remove(); } catch (e) { /* ignora */ } liveMap = null; }
}

/* ---------- rotas finalizadas ---------- */
function loadRoutes() {
  try { return JSON.parse(localStorage.getItem(ROUTES_KEY) || '{}') || {}; } catch (e) { return {}; }
}
function saveRoutes(r) {
  try { localStorage.setItem(ROUTES_KEY, JSON.stringify(r)); return true; }
  catch (e) { toast('Sem espaço para salvar o mapa da rota. Os números foram salvos.', 'danger'); return false; }
}
// Reduz a rota a no máximo ~ROUTE_MAX_POINTS pontos, mantendo início e fim de cada trecho
function simplifyRoute(segments, totalM) {
  const gap = Math.max(5, totalM / CONFIG.GPS.ROUTE_MAX_POINTS);
  return segments.filter(s => s.length).map(seg => {
    const out = [seg[0]];
    for (let i = 1; i < seg.length - 1; i++) {
      if (haversine(out[out.length - 1], seg[i]) >= gap) out.push(seg[i]);
    }
    if (seg.length > 1) out.push(seg[seg.length - 1]);
    return out.map(p => [+p[0].toFixed(5), +p[1].toFixed(5)]);
  });
}

/* ---------- ações ---------- */
function gpsSupportProblem() {
  if (!('geolocation' in navigator)) return 'unsupported';
  if (window.isSecureContext === false) return 'insecure';
  return null;
}

function startDungeon() {
  const prob = gpsSupportProblem();
  if (prob) { showGpsProblem(prob); return; }
  gpsLive = newLive(gpsType || defaultGpsType());
  gpsLastFix = null; gpsWarnedNoSignal = false; mapFollow = true;
  saveLive(); startWatch(); requestWakeLock(); startTicker();
  currentTab = 'gps'; gpsView = 'home';
  render();
  toast('Dungeon aberta. Procurando sinal GPS…', 'gold');
}

function pauseDungeon() {
  const g = gpsLive, now = Date.now();
  if (g.status === 'running' && !g.waiting && g.resumeAt) g.movingMs += now - g.resumeAt;
  g.status = 'paused'; g.resumeAt = null; g.anchor = null; g.waiting = false;
  saveLive(); refreshControls(); updateLiveUI();
}

function resumeDungeon() {
  const g = gpsLive;
  if (curSeg().length) g.segments.push([]);   // novo trecho: não liga o que andou pausado
  g.status = 'running'; g.waiting = true; g.resumeAt = null; g.anchor = null; g.lastMovedAt = Date.now();
  if (gpsWatchId === null) startWatch();
  requestWakeLock(); startTicker(); saveLive();
  refreshControls(); updateLiveUI();
}

// skipConfirm: true quando veio do botão "segure para finalizar"
async function finishDungeon(skipConfirm = false) {
  const g = gpsLive;
  if (!g) return;
  if (g.status !== 'paused') pauseDungeon();
  if (g.distance < CONFIG.GPS.MIN_SAVE_M) {
    const discard = await askConfirm({ title: 'Dungeon quase vazia',
      text: `Só ${Math.round(g.distance)} m registrados. Descartar? (Cancelar volta para a dungeon pausada.)`, ok: 'Descartar', danger: true });
    if (discard) { endLiveSession(); toast('Dungeon descartada.'); render(); }
    return;
  }
  const ok = skipConfirm || await askConfirm({ title: 'Finalizar dungeon?', text: `${fmtKm(g.distance)} km em ${fmtDuration(g.movingMs)}.`, ok: 'Finalizar' });
  if (ok) saveFinishedActivity();
}

// Transforma a atividade ao vivo num registro permanente + XP
function saveFinishedActivity() {
  const g = gpsLive, now = Date.now();
  const cum = g.splits;
  const lastCum = cum.length ? cum[cum.length - 1] : 0;
  const restM = g.distance - cum.length * 1000;
  const act = {
    id: g.id, type: g.type, date: dateKey(), start: g.startedAt, end: now,
    distance: Math.round(g.distance), movingMs: Math.round(g.movingMs), elapsedMs: now - g.startedAt,
    splits: cum.map((c, i) => c - (i ? cum[i - 1] : 0)),
    rest: restM >= 50 ? { m: Math.round(restM), ms: Math.round(g.movingMs - lastCum) } : null,
    xp: 0,
  };
  const routes = loadRoutes();
  routes[act.id] = simplifyRoute(g.segments, g.distance);
  saveRoutes(routes);
  state.activities.push(act);
  endLiveSession();

  // Integração com o Sistema: vira um registro do dia (missão de caminhada, km semanais, sessão longa)
  const before = state.player.totalXp;
  const km = Math.round(act.distance / 10) / 100;
  logActivity(act.type, round1(act.movingMs / 60000), km,
    { gps: true, activityId: act.id, label: `${ACTIVITIES[act.type].label} (GPS)`, silent: true });
  act.xp = state.player.totalXp - before;
  save();
  toast(`Dungeon concluída: ${fmtNum(km)} km`, 'gold', `+${act.xp} XP`);
  vibrate([60, 60, 120]);

  gpsView = 'detail'; gpsSel = act.id; gpsJustFinished = true; currentTab = 'gps';
  render();
  window.scrollTo(0, 0);
}

// Ao abrir o app: existe dungeon não finalizada?
function checkUnfinishedDungeon() {
  const g = loadLive();
  if (!g) return;
  // conta o tempo até o último salvamento; o tempo com o app fechado não entra
  if (g.status === 'running' && !g.waiting && g.resumeAt) g.movingMs += Math.max(0, (g.savedAt || g.resumeAt) - g.resumeAt);
  g.status = 'paused'; g.resumeAt = null; g.anchor = null; g.waiting = false;
  gpsLive = g;
  openModal(`
    <div class="sys-head">[ SISTEMA ]</div>
    <h3>DUNGEON NÃO FINALIZADA</h3>
    <p>Encontrei uma atividade de <b>${fmtKm(g.distance)} km</b> em <b>${fmtDuration(g.movingMs)}</b>,
       iniciada em ${new Date(g.startedAt).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}.</p>
    <p class="small">O tempo em que o app ficou fechado não foi contado.</p>
    <button class="btn primary block" data-m="resume">▶ Retomar</button>
    <button class="btn block" data-m="finish">■ Finalizar e salvar</button>
    <button class="btn ghost block" data-m="discard">Descartar</button>`);
  modalBox.onclick = async e => {
    const b = e.target.closest('[data-m]');
    if (!b) return;
    const m = b.dataset.m;
    closeModal();
    currentTab = 'gps'; gpsView = 'home';
    render();
    if (m === 'resume') resumeDungeon();
    else if (m === 'finish') await finishDungeon();
    else if (await askConfirm({ title: 'Descartar dungeon?', text: 'A atividade em andamento será apagada.', ok: 'Descartar', danger: true })) {
      endLiveSession(); render();
    }
  };
}

function checkGpsPermission() {
  try {
    if (!navigator.permissions) return;
    navigator.permissions.query({ name: 'geolocation' }).then(p => {
      const rerender = () => { if (currentTab === 'gps' && !gpsLive && gpsView === 'home') render(); };
      if (p.state !== gpsPerm) { gpsPerm = p.state; rerender(); }
      p.onchange = () => { gpsPerm = p.state; rerender(); };
    }).catch(() => { /* navegador sem suporte */ });
  } catch (e) { /* ignora */ }
}

function showGpsProblem(kind) {
  const msg = {
    denied: ['LOCALIZAÇÃO NEGADA', 'O Sistema precisa da sua localização para rastrear a dungeon. ' + PERM_HELP],
    unsupported: ['GPS INDISPONÍVEL', 'Este navegador não oferece localização. Tente o Chrome (Android) ou o Safari (iPhone).'],
    insecure: ['HTTPS NECESSÁRIO', 'Navegadores só liberam o GPS em sites HTTPS. Abra o app pelo link do GitHub Pages.'],
  }[kind];
  openModal(`
    <div class="sys-head">[ SISTEMA ]</div>
    <h3>${msg[0]}</h3>
    <p>${esc(msg[1])}</p>
    <p class="small">Enquanto isso, você pode registrar a atividade manualmente.</p>
    <div class="m-actions">
      <button class="btn ghost" data-m="ok">OK</button>
      <button class="btn primary" data-m="log">Registrar manual</button>
    </div>`);
  modalBox.onclick = e => {
    const b = e.target.closest('[data-m]');
    if (!b) return;
    closeModal();
    if (b.dataset.m === 'log') { currentTab = 'log'; render(); }
  };
}

  return renderGpsHome();

  return `

    <div class="types">
      ${['walk', 'run'].map(k => `<button class="type-btn ${type === k ? 'on' : ''}" data-act="gps-type" data-type="${k}" aria-pressed="${type === k}">${icon(ACT_ICON[k])}<span>${ACTIVITIES[k].label}</span></button>`).join('')}
    </div>

      <span class="gate-label">ENTRAR NA DUNGEON</span>
    </button>
    <div class="warn">${icon('phone')}<span><b>Mantenha a tela ligada e o app aberto.</b> Navegadores pausam o GPS quando a tela apaga ou você troca de app.

function gpsRecords() {
  const a = state.activities || [];
  if (!a.length) return null;
  let far = null, long = null, fast = null, bestKm = null;
  for (const x of a) {
    if (!far || x.distance > far.distance) far = x;
    if (!long || x.movingMs > long.movingMs) long = x;
    if (x.distance >= 1000) { const p = x.movingMs / x.distance * 1000; if (!fast || p < fast) fast = p; }
    for (const s of x.splits || []) if (!bestKm || s < bestKm) bestKm = s;
  }
  return { far, long, fast, bestKm };
}

function renderRecords() {
  const r = gpsRecords();
  if (!r) return '';
  return `
  <section class="panel">
    <header class="phead"><div><div class="eyebrow">${icon('trophy')} RECORDES PESSOAIS</div></div></header>
    <div class="tiles two">
      <div class="rec"><span class="k">${icon('route')} Maior distância</span><span class="v">${fmtKm(r.far.distance)}<small>km</small></span></div>
      <div class="rec"><span class="k">${icon('bolt')} Melhor ritmo</span><span class="v">${fmtPace(r.fast)}<small>/km</small></span></div>
      <div class="rec"><span class="k">${icon('clock')} Mais tempo</span><span class="v">${fmtDuration(r.long.movingMs)}</span></div>
      <div class="rec"><span class="k">${icon('flame')} Km mais rápido</span><span class="v">${fmtPace(r.bestKm)}<small>/km</small></span></div>
    </div>
    <p class="info">O melhor ritmo conta atividades a partir de 1 km.</p>
  </section>`;
}

function renderActivityList() {
  const a = (state.activities || []).slice().sort((x, y) => y.start - x.start);
  const items = a.slice(0, 60).map(x => `

        <span class="small">${DOW_SHORT[weekday(x.date)]} ${shortDate(x.date)} · ${ACTIVITIES[x.type].label}</span></span>
      <span class="act-side">${fmtDuration(x.movingMs)}<br>${fmtPace(x.distance >= 50 ? x.movingMs / x.distance * 1000 : null)} /km</span>
      ${icon('next')}
    </button>`).join('');
  return `
  <section class="panel">
    <header class="phead"><div><div class="eyebrow">${icon('route')} DUNGEONS CONCLUÍDAS</div></div></header>
    ${items || emptyState('swords', 'Nenhuma dungeon ainda', 'Sua primeira corrida aparece aqui com mapa, ritmo e parciais por km.')}
  </section>`;
}

function controlsHtml() {
  if (!gpsLive) return '';
  const hold = big => `
    <button class="btn danger hold ${big ? 'big' : ''}" data-hold="gps-finish" aria-label="Segure para finalizar">

    </button>`;
  if (gpsLive.status === 'paused') return `
    <button class="btn primary ctl" data-act="gps-resume">${icon('play')} RETOMAR</button>
    ${hold(true)}`;
  return `
    <button class="btn ctl pause" data-act="gps-pause">${icon('pause')} PAUSAR</button>
    ${hold(false)}`;
}
function refreshControls() {

  if (el) el.innerHTML = controlsHtml();

}

function renderLive() {
  return `

    </div>

    </div>

// Ritmo dos últimos ~30 s do trecho atual (ms por km)
function currentPaceMs(now) {
  const g = gpsLive;
  if (g.status !== 'running' || g.waiting || now - g.lastMovedAt > 10000) return null;
  const seg = curSeg();
  if (seg.length < 2) return null;
  const last = seg[seg.length - 1];
  let first = seg[seg.length - 2];
  for (let i = seg.length - 2; i >= 0; i--) { first = seg[i]; if (last[2] - seg[i][2] >= CONFIG.GPS.PACE_WINDOW_MS) break; }
  const dd = last[3] - first[3], dtm = last[2] - first[2];
  return dd >= 20 && dtm > 0 ? dtm / dd * 1000 : null;
}

// Atualiza só os números e indicadores (sem redesenhar a tela nem o mapa)
function setChip(el, cls, ic, text) {
  const html = `${icon(ic)}<span>${text}</span>`;
  el.className = 'sig ' + cls;
  if (el.dataset.html !== html) { el.dataset.html = html; el.innerHTML = html; }
}
function updateLiveUI() {
  const g = gpsLive, $ = id => document.getElementById(id);
  if (!g || !$('gps-dist')) return;
  const now = Date.now(), mov = movingNow(now);
  $('gps-dist').textContent = fmtKm(g.distance);
  $('gps-time').textContent = fmtDuration(mov);
  $('gps-pace').textContent = fmtPace(currentPaceMs(now));
  $('gps-avg').textContent = fmtPace(g.distance >= 50 ? mov / g.distance * 1000 : null);

  const sig = $('gps-signal');
  if (!gpsLastFix) setChip(sig, 'off', 'pin', 'GPS: procurando…');
  else if (now - gpsLastFix.t > 10000) setChip(sig, 'bad', 'pin', 'GPS: sem sinal');
  else {
    const a = gpsLastFix.acc;
    setChip(sig, a <= 10 ? 'good' : a <= CONFIG.GPS.MAX_ACCURACY ? 'mid' : 'bad', 'pin', `GPS ±${Math.round(a)} m`);
  }
  setChip($('gps-wake'), wakeState === 'on' ? 'good' : wakeState === 'unsupported' ? 'bad' : 'mid', 'phone',
    wakeState === 'on' ? 'Tela ligada' : wakeState === 'unsupported' ? 'Tela: sem suporte' : 'Tela pode apagar');
  setChip($('gps-ap'), g.autoPause ? 'good' : 'off', 'pause_auto', g.autoPause ? 'Auto-pausa on' : 'Auto-pausa off');

  const txt = g.status === 'paused' ? 'PAUSADO'
    : g.status === 'autopaused' ? 'AUTO-PAUSA · PARADO'
    : g.waiting ? 'PROCURANDO SINAL GPS · O TEMPO COMEÇA COM SINAL BOM' : '';
  const st = $('gps-status');
  if (st.dataset.txt !== txt) {
    st.dataset.txt = txt;
    st.innerHTML = txt ? `<div class="status-banner">${icon(g.waiting && g.status === 'running' ? 'pin' : 'pause_auto')}${txt}</div>` : '';
  }
}

function renderActivityDetail(id) {
  const x = (state.activities || []).find(a => a.id === id);
  if (!x) { gpsView = 'home'; return renderGpsHome(); }
  const pace = x.distance >= 50 ? x.movingMs / x.distance * 1000 : null;
  const rows = (x.splits || []).map((ms, i) => ({ label: `${i + 1}`, pace: ms }));
  if (x.rest) rows.push({ label: `+${fmtNum(x.rest.m / 1000)}`, pace: x.rest.ms / x.rest.m * 1000 });
  const best = Math.min(...rows.map(r => r.pace));
  const started = new Date(x.start);
  return `
  <section class="panel hero">
    <div class="back-row">
      <button class="btn ghost" data-act="gps-back">${icon('prev')} Voltar</button>
      <span class="small">${DOW_SHORT[started.getDay()]} ${shortDate(x.date)} · ${started.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span>
    </div>
    ${gpsJustFinished ? '<div class="finish-title">DUNGEON CONCLUÍDA</div>' : ''}
    <div class="eyebrow" style="justify-content:center;margin-top:12px">${icon(ACT_ICON[x.type])} ${ACTIVITIES[x.type].label.toUpperCase()}</div>
    <div class="live-dist"><span class="v">${fmtKm(x.distance)}</span><span class="u">KM</span></div>
    <div class="tiles" style="margin-top:12px">
      <div class="rec"><span class="k">Movimento</span><span class="v">${fmtDuration(x.movingMs)}</span></div>
      <div class="rec"><span class="k">Ritmo</span><span class="v">${fmtPace(pace)}</span></div>
      <div class="rec"><span class="k">Total</span><span class="v">${fmtDuration(x.elapsedMs)}</span></div>
    </div>
    <div class="xp-earned">${icon('spark')} +${x.xp} XP GANHOS</div>
    <div class="map-wrap"><div class="map small" id="route-map"></div></div>
  </section>
  <section class="panel">
    <header class="phead"><div><div class="eyebrow">${icon('gauge')} PARCIAIS POR KM</div></div></header>
    ${rows.length ? `<div class="split-head"><span>Km</span><span></span><span style="text-align:right">Ritmo</span></div>` +
      rows.map(r => `
        <div class="split-row ${rows.length > 1 && r.pace === best ? 'best' : ''}">
          <span class="km">${r.label}</span>
          <div class="bar"><i style="width:${Math.round(best / r.pace * 100)}%"></i></div>
          <span class="pace">${fmtPace(r.pace)}</span>
        </div>`).join('')
      : emptyState('gauge', 'Ainda sem parciais', 'Parciais aparecem a partir do primeiro km completo.')}
  </section>
  <section class="panel">
    <button class="btn danger block" style="margin-top:0" data-act="gps-delete" data-id="${x.id}">${icon('trash')} Apagar esta atividade</button>
    <p class="info">Apaga só o mapa e a atividade desta lista. O XP e o registro do dia continuam.</p>
  </section>`;
}

/* ---------- mapas (Leaflet + OpenStreetMap) ---------- */
function makeMap(el) {
  if (!el) return null;
  if (!window.L) {
    el.innerHTML = '<div class="map-off">Mapa indisponível agora (sem internet ou o Leaflet não carregou).<br>O GPS e a distância continuam funcionando.</div>';
    return null;
  }
  const m = L.map(el, { zoomControl: false, attributionControl: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(m);
  setTimeout(() => { try { m.invalidateSize(); } catch (e) { /* mapa já removido */ } }, 150);
  return m;
}
const routeLatLngs = segs => segs.filter(s => s.length).map(s => s.map(p => [p[0], p[1]]));

function mountLiveMap() {
  if (liveMap) { try { liveMap.remove(); } catch (e) { /* ignora */ } liveMap = null; }
  liveMap = makeMap(document.getElementById('live-map'));
  if (!liveMap) return;
  liveLine = L.polyline(routeLatLngs(gpsLive.segments), { color: '#5fe3ff', weight: 5, opacity: 0.95 }).addTo(liveMap);
  liveAcc = L.circle([0, 0], { radius: 1, color: '#3fa9ff', weight: 1, fillOpacity: 0.12 });
  liveMarker = L.circleMarker([0, 0], { radius: 8, color: '#fff', weight: 2, fillColor: '#3fa9ff', fillOpacity: 1 });
  const lp = lastPoint();
  const start = gpsLastFix ? [gpsLastFix.lat, gpsLastFix.lng] : (lp ? [lp[0], lp[1]] : null);
  if (start) liveMap.setView(start, 17); else liveMap.setView([-14.2, -51.9], 4);
  liveMap.on('dragstart', () => {
    mapFollow = false;
    const b = document.getElementById('gps-recenter');
    if (b) b.classList.remove('hidden');
  });
  updateLiveMarker();
}
function updateLiveMap() {
  try { if (liveMap && gpsLive) liveLine.setLatLngs(routeLatLngs(gpsLive.segments)); } catch (e) { /* mapa é opcional */ }
}
function updateLiveMarker() {
  try { moveLiveMarker(); } catch (e) { /* mapa é opcional */ }
}
function moveLiveMarker() {
  if (!liveMap || !gpsLastFix) return;
  const ll = [gpsLastFix.lat, gpsLastFix.lng];
  liveMarker.setLatLng(ll);
  liveAcc.setLatLng(ll).setRadius(gpsLastFix.acc);
  if (!liveMap.hasLayer(liveMarker)) { liveAcc.addTo(liveMap); liveMarker.addTo(liveMap); }
  if (mapFollow) liveMap.setView(ll, Math.max(liveMap.getZoom() || 17, 16));
}

function mountRouteMap(id) {
  if (routeMap) { try { routeMap.remove(); } catch (e) { /* ignora */ } routeMap = null; }
  const el = document.getElementById('route-map');
  if (!el) return;
  const segs = (loadRoutes()[id] || []).filter(s => s.length);
  if (!segs.length) { el.innerHTML = '<div class="map-off">Rota não disponível.</div>'; return; }
  routeMap = makeMap(el);
  if (!routeMap) return;
  const line = L.polyline(segs, { color: '#5fe3ff', weight: 5 }).addTo(routeMap);
  const lastSeg = segs[segs.length - 1];
  L.circleMarker(segs[0][0], { radius: 7, color: '#fff', weight: 2, fillColor: '#5fe39a', fillOpacity: 1 }).addTo(routeMap).bindTooltip('Início');
  L.circleMarker(lastSeg[lastSeg.length - 1], { radius: 7, color: '#fff', weight: 2, fillColor: '#ff5d78', fillOpacity: 1 }).addTo(routeMap).bindTooltip('Fim');
  const fit = () => { try { routeMap.invalidateSize(); routeMap.fitBounds(line.getBounds(), { padding: [24, 24], maxZoom: 17 }); } catch (e) { /* ignora */ } };
  fit();
  setTimeout(fit, 200);
}

// Chamado no fim de todo render(): monta/desmonta os mapas da aba Dungeon
function afterRenderGps() {
  if (currentTab !== 'gps' || !gpsLive) {
    if (liveMap) { try { liveMap.remove(); } catch (e) { /* ignora */ } liveMap = null; }
  }
  if (currentTab !== 'gps' || gpsLive || gpsView !== 'detail') {
    if (routeMap) { try { routeMap.remove(); } catch (e) { /* ignora */ } routeMap = null; }
  }
  if (currentTab !== 'gps') return;
  // O mapa nunca pode derrubar o rastreamento: se algo falhar, mostra o aviso e segue
  try {
    if (gpsLive) mountLiveMap();
    else if (gpsView === 'detail' && gpsSel) mountRouteMap(gpsSel);
  } catch (e) {
    liveMap = null; routeMap = null;
    const el = document.getElementById(gpsLive ? 'live-map' : 'route-map');
    if (el) el.innerHTML = '<div class="map-off">Não foi possível desenhar o mapa. O GPS continua funcionando.</div>';
  }
  if (gpsLive) updateLiveUI();
}

function liveBannerHtml() {
  return `<button class="live-banner" data-act="tab" data-tab="gps">${icon('swords')}<span>Dungeon em andamento · <b>${fmtKm(gpsLive.distance)} km</b></span>${icon('next')}</button>`;
}

/* Tela apagou / trocou de app: salva já. Ao voltar: pede a tela ligada de novo,
   reinicia o GPS e avisa que o trecho perdido será ligado em linha reta. */
document.addEventListener('visibilitychange', () => {
  if (!gpsLive) return;
  if (document.hidden) { gpsHiddenAt = Date.now(); saveLive(); return; }
  if (gpsLive.status === 'paused') return;
  requestWakeLock();
  startWatch();
  const gap = Date.now() - (gpsHiddenAt || Date.now());
  if (gpsLive.status === 'running') gpsLive.lastMovedAt = Date.now();  // não dispara auto-pausa pelo tempo fora
  if (gap > 15000) toast('O app ficou em segundo plano: o GPS pode ter pausado. O trecho perdido será ligado em linha reta.', 'gold');
});
window.addEventListener('pagehide', saveLive);
window.__leafletReady = () => { if (currentTab === 'gps') render(); };


/* ---------- INICIALIZAÇÃO ---------- */
ensureToday();
render();
if (!state.onboarded) showOnboarding(); else { announce(); checkUnfinishedDungeon(); }
checkGpsPermission();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(setupPWA);
</script>
