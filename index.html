<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03060c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sistema">
<title>SISTEMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Leaflet (mapa) + tiles do OpenStreetMap: gratuito, sem chave de API -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer onload="window.__leafletReady && window.__leafletReady()"></script>
<!-- manifest e ícone são gerados em tempo de execução (ver seção 10 do script) -->
<link rel="manifest" id="manifest-link">
<link rel="apple-touch-icon" id="apple-icon">

<style>
/* =========================================================
   VISUAL — "janela do Sistema"
   ---------------------------------------------------------
   • Cores-base nas variáveis abaixo.
   • --accent muda conforme o rank (atributo data-rank no <html>,
     definido pelo render()).
   • Animações de entrada só rodam com .enter no #view
     (quando você troca de aba), não a cada toque.
   ========================================================= */
:root{
  --bg:#02050b;
  --panel-top:rgba(11,30,62,.94);
  --panel-bot:rgba(4,13,30,.96);
  --inset:rgba(2,9,22,.75);
  --line:#3fa9ff;
  --line-mid:rgba(63,169,255,.5);
  --line-soft:rgba(63,169,255,.22);
  --text:#e4f2ff;
  --muted:#a6bedc;
  --cyan:#5fe3ff;
  --danger:#ff6b84;
  --gold:#ffd36b;
  --purple:#b98bff;
  --green:#5fe39a;
  /* cor de cada atributo */
  --str:#ff7b8f; --agi:#5fe3ff; --end:#6aa8ff; --dis:#ffd36b;
  /* cor de destaque (muda com o rank) */
  --accent:#3fa9ff; --accent-rgb:63,169,255;
  --tech:'Orbitron', ui-monospace, monospace;
  --ui:'Rajdhani', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --nav-h:66px;
}
:root[data-rank="E"]{--accent:#aebfd6;--accent-rgb:174,191,214}
:root[data-rank="D"]{--accent:#5fe39a;--accent-rgb:95,227,154}
:root[data-rank="C"]{--accent:#3fa9ff;--accent-rgb:63,169,255}
:root[data-rank="B"]{--accent:#b98bff;--accent-rgb:185,139,255}
:root[data-rank="A"]{--accent:#ff9f43;--accent-rgb:255,159,67}
:root[data-rank="S"]{--accent:#ffd36b;--accent-rgb:255,211,107}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{background:var(--bg)}
body{
  font-family:var(--ui);font-size:17px;line-height:1.35;color:var(--text);
  background:
    radial-gradient(120% 55% at 50% -12%, rgba(var(--accent-rgb),.20), transparent 62%),
    radial-gradient(90% 50% at 110% 105%, rgba(40,90,200,.14), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  min-height:100vh;min-height:100dvh;
  padding-bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
}
/* textura de holograma: grade + scanlines (camadas fixas, sem custo de repintura) */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(rgba(63,169,255,.045) 1px, transparent 1px) 0 0/100% 28px,
    linear-gradient(90deg, rgba(63,169,255,.03) 1px, transparent 1px) 0 0/28px 100%;
  -webkit-mask-image:radial-gradient(ellipse at 50% 15%, #000 25%, transparent 80%);
  mask-image:radial-gradient(ellipse at 50% 15%, #000 25%, transparent 80%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:95;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px);
}
button{font-family:inherit;color:inherit}
b{color:#fff;font-weight:700}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---------- ícones SVG ---------- */
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.fill{fill:currentColor;stroke:none}

/* ---------- topo ---------- */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(2,6,14,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line-soft);
}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.8}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--tech);font-weight:900;letter-spacing:.32em;font-size:15px;color:#fff;text-shadow:0 0 12px rgba(var(--accent-rgb),.8)}
.brand-mark{width:10px;height:10px;transform:rotate(45deg);border:2px solid var(--accent);box-shadow:0 0 8px var(--accent)}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.toprank{font-family:var(--tech);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent)}
.topdate{font-family:var(--tech);font-size:12px;letter-spacing:.1em;color:var(--muted)}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:4px 14px 12px}

/* ---------- painel (janela do Sistema) ---------- */
.panel{
  position:relative;margin:14px 0;padding:16px;
  background:linear-gradient(180deg,var(--panel-top),var(--panel-bot));
  border:1px solid var(--line-mid);border-radius:4px;
  box-shadow:0 8px 24px rgba(0,0,0,.35), 0 0 16px rgba(63,169,255,.12), inset 0 1px 0 rgba(255,255,255,.05);
}
.panel::before,.panel::after{
  content:'';position:absolute;width:16px;height:16px;border:2px solid var(--accent);pointer-events:none;
  filter:drop-shadow(0 0 4px rgba(var(--accent-rgb),.9));
}
.panel::before{top:-2px;left:-2px;border-right:0;border-bottom:0;border-top-left-radius:4px}
.panel::after{bottom:-2px;right:-2px;border-left:0;border-top:0;border-bottom-right-radius:4px}
.panel.hero{
  border-color:var(--line);
  box-shadow:0 10px 30px rgba(0,0,0,.42), 0 0 26px rgba(63,169,255,.28), inset 0 0 30px rgba(63,169,255,.07);
}
.panel.hero.is-complete{border-color:rgba(95,227,154,.7)}
/* animação de entrada: só ao trocar de aba */
.enter > .panel{animation:panelIn .42s var(--ease) both}
.enter > .panel:nth-child(2){animation-delay:.05s}
.enter > .panel:nth-child(3){animation-delay:.1s}
.enter > .panel:nth-child(4){animation-delay:.15s}
.enter > .panel:nth-child(5){animation-delay:.2s}
@keyframes panelIn{from{opacity:0;transform:translateY(10px) scaleY(.96)}to{opacity:1;transform:none}}

.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.eyebrow{display:flex;align-items:center;gap:6px;font-family:var(--tech);font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--cyan)}
.eyebrow .ic{width:16px;height:16px}
.ptitle-lg{margin:4px 0 0;font-size:22px;font-weight:700;letter-spacing:.01em;color:#fff;line-height:1.15}
.phead-meta{flex:none;text-align:right}
.phead-meta b{display:block;font-family:var(--tech);font-size:22px;line-height:1.1}
.phead-meta span{font-size:13px;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.info,.lead{font-size:14px;color:var(--muted);line-height:1.45;margin:10px 0 0}
.lead{margin:0 0 12px}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:10px 12px;border-left:2px solid var(--line-mid);background:var(--inset);font-size:14px;color:var(--muted);line-height:1.4;border-radius:0 4px 4px 0}
.note .ic{color:var(--cyan);margin-top:1px}

/* ---------- barras ---------- */
.bar{height:8px;background:rgba(63,169,255,.12);border-radius:4px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2a7fff,var(--cyan));box-shadow:0 0 10px rgba(95,227,255,.6)}
.bar.thin{height:5px}
.bar.gold>i{background:linear-gradient(90deg,#d99a1e,var(--gold));box-shadow:0 0 10px rgba(255,211,107,.5)}

/* ---------- botões ---------- */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:10px 14px;border-radius:4px;border:1px solid var(--line-mid);
  background:rgba(63,169,255,.10);color:var(--text);font-weight:700;font-size:16px;letter-spacing:.02em;
  cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden;
  transition:transform .1s, background .2s, box-shadow .2s;
}
.btn::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,rgba(255,255,255,.28),transparent 65%);opacity:0;transition:opacity .35s;pointer-events:none}
.btn:active{transform:scale(.97)}
.btn:active::after{opacity:1;transition:none}
.btn.primary{background:linear-gradient(180deg,#2f8dff,#1756c4);border-color:#7cc4ff;color:#fff;box-shadow:0 0 16px rgba(63,169,255,.45), inset 0 1px 0 rgba(255,255,255,.3)}
.btn.ghost{background:transparent;border-color:var(--line-soft);color:var(--muted)}
.btn.gold{border-color:rgba(255,211,107,.7);color:var(--gold);background:rgba(255,211,107,.07)}
.btn.danger{border-color:rgba(255,107,132,.75);color:#ffb8c4;background:rgba(255,107,132,.08)}
.btn.block{display:flex;width:100%;margin-top:12px}
.btn.big{min-height:56px;font-size:18px}
.btn.sm{flex:1;min-height:44px;font-size:15px;padding:8px 10px}
.m-actions{display:grid;grid-template-columns:1fr 1.7fr;gap:8px;margin-top:12px}
.m-actions .btn{width:100%}

/* ---------- navegação inferior ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  min-height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom);
  background:linear-gradient(180deg,rgba(3,8,18,.9),rgba(2,5,11,.98));
  border-top:1px solid var(--line-soft);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.bottomnav button{
  position:relative;min-height:var(--nav-h);background:none;border:0;color:var(--muted);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:12px;font-weight:700;letter-spacing:.04em;touch-action:manipulation;transition:color .2s;
}
.bottomnav button .ic{width:22px;height:22px;transition:transform .2s var(--ease)}
.bottomnav button.active{color:#fff}
.bottomnav button.active .ic{color:var(--accent);filter:drop-shadow(0 0 6px var(--accent));transform:translateY(-1px)}
.bottomnav button.active::before{content:'';position:absolute;top:0;left:24%;right:24%;height:2px;border-radius:0 0 2px 2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.nav-dungeon .portal{
  width:58px;height:58px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%, rgba(var(--accent-rgb),.55), #071530 68%);
  border:2px solid var(--accent);
  box-shadow:0 0 16px rgba(var(--accent-rgb),.6), inset 0 0 14px rgba(var(--accent-rgb),.5), 0 0 0 5px rgba(2,5,11,.95);
}
.nav-dungeon .portal .ic{width:26px;height:26px;color:#fff}
.bottomnav .nav-dungeon.active::before{display:none}
.bottomnav .nav-dungeon.active .portal .ic{color:#fff;transform:none}
.nav-dungeon.live .portal{animation:portalPulse 1.6s ease-in-out infinite}
@keyframes portalPulse{50%{box-shadow:0 0 30px rgba(var(--accent-rgb),.95), inset 0 0 20px rgba(var(--accent-rgb),.8), 0 0 0 5px rgba(2,5,11,.95)}}

/* ---------- cartão de caçador ---------- */
.hunter{
  border-color:rgba(var(--accent-rgb),.7);
  background:
    linear-gradient(135deg, rgba(var(--accent-rgb),.16), transparent 48%),
    linear-gradient(180deg, var(--panel-top), var(--panel-bot));
}
.hunter-top{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:108px;height:108px;flex:none}
.ring-svg{width:108px;height:108px;display:block;overflow:visible}
.ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:7}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(var(--accent-rgb),.9));transition:stroke-dashoffset 1.1s var(--ease)}
.ring-tick{fill:none;stroke:rgba(var(--accent-rgb),.35);stroke-width:1;stroke-dasharray:2 6}
.hex{fill:rgba(var(--accent-rgb),.13);stroke:var(--accent);stroke-width:2}
.hex-letter{font-family:var(--tech);font-weight:900;font-size:36px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.hunter-info{flex:1;min-width:0}
.hunter-name{font-size:24px;font-weight:700;line-height:1.1;margin-top:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hunter-level{font-family:var(--tech);font-size:13px;letter-spacing:.14em;color:var(--muted);margin-top:6px}
.hunter-level b{font-size:30px;letter-spacing:0;margin-left:4px;text-shadow:0 0 12px rgba(var(--accent-rgb),.7)}
.xp-line{font-family:var(--tech);font-size:13px;color:var(--muted);margin-top:2px}
.xp-line b{color:var(--accent)}
.hunter-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.pill{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 10px;border:1px solid var(--line-soft);background:var(--inset);border-radius:4px;font-size:15px}
.pill .ic{color:var(--muted)}
.pill.hot .ic{color:#ff9f43;filter:drop-shadow(0 0 6px rgba(255,159,67,.8))}
.next-rank{margin-top:10px}
.risk{display:flex;gap:8px;align-items:center;margin-top:10px;padding:10px 12px;border:1px solid rgba(255,107,132,.5);background:rgba(255,107,132,.08);color:#ffd3da;font-size:14px;border-radius:4px}
.risk .ic{color:var(--danger)}

/* ---------- missões ---------- */
.segs{display:flex;gap:5px;margin-bottom:4px}
.segs i{flex:1;height:4px;border-radius:2px;background:rgba(63,169,255,.16)}
.segs i.on{background:var(--green);box-shadow:0 0 8px rgba(95,227,154,.7)}
.mission{position:relative;overflow:hidden;margin-top:10px;padding:12px;border:1px solid var(--line-soft);border-left:3px solid var(--mc,var(--line));background:var(--inset);border-radius:4px}
.m-row{display:flex;align-items:flex-start;gap:12px}
.m-ic{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--mc);border:1px solid currentColor;background:rgba(255,255,255,.03)}
.m-main{flex:1;min-width:0}
.m-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.m-name{font-size:18px;font-weight:700;line-height:1.2;color:#fff}
.m-val{flex:none;font-family:var(--tech);font-size:12px;color:var(--muted);white-space:nowrap}
.m-val b{font-size:18px}
.m-hint{font-size:14px;color:var(--muted);line-height:1.35;margin-top:4px}
.m-tag{display:inline-block;font-family:var(--tech);font-size:12px;letter-spacing:.08em;padding:1px 6px;border:1px solid currentColor;border-radius:3px;margin-right:6px;vertical-align:2px}
.m-tag.danger{color:var(--danger)}
.m-tag.gold{color:var(--gold)}
.mission .bar{margin-top:12px}
.mission .bar>i{background:var(--mc);box-shadow:0 0 8px var(--mc)}
.mission.penalty{border-color:rgba(255,107,132,.45);background:linear-gradient(90deg,rgba(255,107,132,.12),var(--inset) 65%)}
.mission.busy{background:linear-gradient(90deg,rgba(255,211,107,.10),var(--inset) 65%)}
.mission.done{padding:10px 12px;border-left-color:var(--green);background:rgba(95,227,154,.05)}
.mission.done .m-row{align-items:center}
.mission.done .m-ic{width:34px;height:34px;color:#04160c;border-color:var(--green);background:var(--green);box-shadow:0 0 12px rgba(95,227,154,.6)}
.mission.done .m-name{font-size:16px;color:var(--muted)}
.xp-chip{flex:none;font-family:var(--tech);font-size:12px;color:var(--gold);padding:4px 8px;border:1px solid rgba(255,211,107,.4);border-radius:3px}
/* missão recém-concluída: brilho + varredura + check desenhado */
.just-done{animation:doneGlow 1s var(--ease)}
.just-done::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-100%);animation:sweep .9s .1s var(--ease) forwards}
.just-done .m-ic,.just-done .w-ic{animation:popIn .5s var(--ease)}
.just-done .m-ic path,.just-done .w-ic path{stroke-dasharray:22;stroke-dashoffset:22;animation:draw .45s .2s var(--ease) forwards}
@keyframes doneGlow{30%{box-shadow:0 0 26px rgba(95,227,154,.55);border-color:var(--green)}}
@keyframes sweep{to{transform:translateX(100%)}}
@keyframes popIn{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
.complete-banner{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:12px;border:1px solid var(--green);border-radius:4px;color:var(--green);background:rgba(95,227,154,.06);box-shadow:0 0 14px rgba(95,227,154,.25);font-family:var(--tech);font-size:12px;letter-spacing:.12em;text-align:center}

/* ---------- missões semanais ---------- */
.days-left{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid rgba(255,211,107,.4);border-radius:4px}
.days-left b{font-family:var(--tech);font-size:22px;color:var(--gold)}
.days-left span{font-size:12px;line-height:1.1;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.wrow{position:relative;overflow:hidden;padding:12px;margin-top:8px;border:1px solid var(--line-soft);background:var(--inset);border-radius:4px}
.w-top{display:flex;align-items:center;gap:10px}
.w-ic{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,211,107,.45);color:var(--gold)}
.w-ic .ic{width:18px;height:18px}
.w-name{flex:1;min-width:0;font-weight:700;font-size:16px;line-height:1.2}
.w-val{flex:none;font-family:var(--tech);font-size:13px;color:#fff}
.w-hint{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.35}
.w-actions{display:flex;gap:8px;margin-top:10px}
.w-done{font-family:var(--tech);font-size:12px;letter-spacing:.1em;color:var(--green);margin-top:8px}
.wrow.done{border-color:rgba(95,227,154,.3)}
.wrow.done .w-ic{background:var(--green);border-color:var(--green);color:#04160c}

/* ---------- atributos (radar) ---------- */
.attrs{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
.radar{width:150px;height:150px;display:block;overflow:visible}
.radar .grid{fill:none;stroke:rgba(63,169,255,.18);stroke-width:1}
.radar .axis{stroke:rgba(63,169,255,.22);stroke-width:1}
.radar .shape{fill:rgba(var(--accent-rgb),.22);stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.radar .lbl{font-family:var(--tech);font-size:13px;font-weight:700;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.enter .radar .shape{animation:radarIn .8s .2s var(--ease) both;transform-origin:80px 80px}
@keyframes radarIn{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.attr{padding:5px 0}
.attr-top{display:flex;align-items:center;gap:8px}
.attr-top .ic{width:18px;height:18px;color:var(--sc)}
.attr-name{flex:1;font-family:var(--tech);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.attr-top b{font-family:var(--tech);font-size:18px}
.attr .bar{margin-top:5px;height:5px}
.attr .bar>i{background:var(--sc);box-shadow:0 0 8px var(--sc)}
@media (max-width:340px){.attrs{grid-template-columns:1fr}.radar{margin:0 auto}}

/* ---------- notificações [SISTEMA] ---------- */
#toasts{position:fixed;top:calc(60px + env(safe-area-inset-top));left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{
  --tc:var(--line);--tc-rgb:63,169,255;
  width:100%;max-width:440px;background:rgba(4,14,32,.97);border:1px solid var(--tc);border-radius:3px;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.5), 0 0 18px rgba(var(--tc-rgb),.35), inset 0 0 20px rgba(var(--tc-rgb),.08);
  transform-origin:top center;animation:winOpen .38s var(--ease) both;
}
.toast.ok{--tc:var(--green);--tc-rgb:95,227,154}
.toast.danger{--tc:var(--danger);--tc-rgb:255,107,132}
.toast.gold{--tc:var(--gold);--tc-rgb:255,211,107}
.toast.out{animation:winClose .28s ease forwards}
.t-head{display:flex;align-items:center;gap:6px;padding:5px 10px;font-family:var(--tech);font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--tc);background:rgba(var(--tc-rgb),.1);border-bottom:1px solid rgba(var(--tc-rgb),.3)}
.t-head .ic{width:15px;height:15px}
.t-extra{margin-left:auto;color:var(--gold);letter-spacing:.06em}
.t-body{padding:8px 12px 10px;font-size:16px;font-weight:600;line-height:1.3;min-height:1.3em}
.caret{display:inline-block;width:7px;height:1em;margin-left:2px;vertical-align:-2px;background:var(--tc);animation:blink .7s steps(1) infinite}
@keyframes winOpen{0%{opacity:0;transform:scaleX(.5) scaleY(.03)}45%{opacity:1;transform:scaleX(1) scaleY(.03)}100%{transform:none}}
@keyframes winClose{to{opacity:0;transform:scaleY(.03)}}
@keyframes blink{50%{opacity:0}}

/* ---------- modal (janela) ---------- */
.modal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,3,10,.82)}
.modal-box{width:100%;max-width:420px;margin:0;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow:auto;animation:winOpen .42s var(--ease) both}
.sys-head{display:flex;justify-content:center;align-items:center;gap:8px;font-family:var(--tech);font-size:12px;letter-spacing:.3em;color:var(--cyan);padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line-soft)}
.modal-box h3{text-align:center;font-family:var(--tech);margin:6px 0 10px;font-size:17px;letter-spacing:.06em;color:#fff;line-height:1.3}
.modal-box p{text-align:center;margin:8px 0;line-height:1.4}
.num-input{width:100%;min-height:64px;font-family:var(--tech);font-size:30px;text-align:center;padding:8px;background:rgba(2,8,20,.9);color:#fff;border:1px solid var(--line);border-radius:4px;outline:none;box-shadow:inset 0 0 18px rgba(63,169,255,.12)}
.num-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(95,227,255,.15), inset 0 0 18px rgba(63,169,255,.12)}
.quick{display:flex;gap:8px;margin-top:10px}
.quick .btn{flex:1;min-height:46px;font-size:16px}

/* ---------- LEVEL UP / RANK UP (tela cheia) ---------- */
.cine{
  --cr:var(--cyan);--cr-rgb:95,227,255;
  position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:hidden;cursor:pointer;
  background:radial-gradient(circle at 50% 45%, rgba(var(--cr-rgb),.30), transparent 62%), rgba(1,4,10,.97);
  animation:fadeIn .25s ease both;
}
.cine.out{animation:fadeOut .26s ease forwards}
.cine::before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.cine-beam{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--cr);box-shadow:0 0 20px var(--cr),0 0 60px var(--cr);animation:beam 1s var(--ease) both}
@keyframes beam{0%{transform:scaleX(0);opacity:1}45%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1) scaleY(60);opacity:0}}
.cine-inner{position:relative;max-width:340px}
.cine-sys{font-family:var(--tech);font-size:12px;letter-spacing:.32em;color:var(--cr);animation:fadeIn .4s .35s both}
.cine-title{font-family:var(--tech);font-weight:900;font-size:clamp(38px,12vw,52px);letter-spacing:.08em;color:#fff;margin:8px 0;text-shadow:0 0 18px var(--cr),0 0 40px var(--cr);animation:slam .6s .4s var(--ease) both}
.cine-level{display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--tech);animation:fadeIn .4s .85s both}
.cine-level span{font-size:28px;color:var(--muted)}
.cine-level b{font-size:68px;line-height:1;text-shadow:0 0 18px var(--cr)}
.cine-level .ic,.cine-ranks .ic{width:28px;height:28px;color:var(--cr)}
.cine-text{font-size:16px;line-height:1.45;margin:14px 0 6px;animation:fadeIn .5s 1.1s both}
.cine-hint{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;animation:fadeIn .5s 1.4s both}
.cine-ranks{display:flex;align-items:center;justify-content:center;gap:16px;margin:12px 0}
.cine-ranks .old{font-family:var(--tech);font-weight:900;font-size:40px;color:var(--muted);opacity:.6;animation:fadeIn .4s .8s both}
.hexwrap{position:relative;width:150px;height:150px}
.hexbig{width:150px;height:150px;display:block;overflow:visible;animation:grow .9s 1s var(--ease) both}
.hexbig polygon{fill:rgba(var(--cr-rgb),.15);stroke:var(--cr);stroke-width:3}
.hexbig text{font-family:var(--tech);font-weight:900;font-size:66px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.burst{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px;border-radius:50%;border:2px solid var(--cr);opacity:0;animation:burst 1.2s 1.05s ease-out both}
.burst.b2{animation-delay:1.3s}
@keyframes burst{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes slam{from{opacity:0;transform:scale(2.2);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes grow{from{opacity:0;transform:scale(.2) rotate(-12deg)}60%{opacity:1;transform:scale(1.12)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}

/* "+15 XP" flutuante */
.xp-float{position:fixed;z-index:85;pointer-events:none;font-family:var(--tech);font-weight:900;font-size:22px;color:var(--gold);text-shadow:0 0 10px rgba(255,211,107,.9),0 2px 0 rgba(0,0,0,.6);transform:translate(-50%,-50%);animation:floatUp 1.3s var(--ease) forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-280%) scale(1)}}

/* ---------- formulários ---------- */
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:82px;padding:10px;
  border:1px solid var(--line-soft);background:var(--inset);border-radius:4px;font-size:15px;font-weight:700;color:var(--muted);
  cursor:pointer;touch-action:manipulation;transition:color .2s,border-color .2s,background .2s,box-shadow .2s;
}
.type-btn .ic{width:28px;height:28px}
.type-btn:active{transform:scale(.98)}
.type-btn.on{color:#fff;border-color:var(--cyan);background:rgba(63,169,255,.18);box-shadow:0 0 14px rgba(95,227,255,.35), inset 0 0 14px rgba(95,227,255,.12)}
.type-btn.on .ic{color:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan))}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-top:14px}
.field label,.field .label{display:block;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.text-input{width:100%;min-height:50px;font-size:18px;padding:10px 12px;background:rgba(2,8,20,.9);color:#fff;border:1px solid var(--line-soft);border-radius:4px;font-family:var(--ui);font-weight:700;outline:none;transition:border-color .2s,box-shadow .2s}
.text-input.big{font-family:var(--tech);font-size:24px;text-align:center}
.text-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(95,227,255,.15)}
.text-input::placeholder{color:rgba(166,190,220,.45)}
.quick-row{display:flex;gap:6px;margin-top:6px}
.qchip{flex:1;min-height:44px;border:1px solid var(--line-soft);background:rgba(63,169,255,.06);border-radius:4px;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;touch-action:manipulation}
.qchip:active{background:rgba(63,169,255,.22);color:#fff}
.chips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.chip{min-height:46px;padding:0;border:1px solid var(--line-soft);background:var(--inset);border-radius:4px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;touch-action:manipulation}
.chip.on{color:#fff;background:rgba(63,169,255,.32);border-color:var(--line);box-shadow:0 0 8px rgba(63,169,255,.5)}
.chip.gold.on{background:rgba(255,211,107,.2);border-color:var(--gold);box-shadow:0 0 8px rgba(255,211,107,.4)}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding:10px 12px;border:1px solid var(--line-soft);background:var(--inset);border-radius:4px}
.toggle-row b{font-size:16px}
.switch{position:relative;flex:none;width:60px;height:36px;padding:0;border-radius:18px;border:1px solid var(--line);background:rgba(2,8,20,.9);cursor:pointer}
.switch::before{content:'';position:absolute;inset:-6px}
.switch::after{content:'';position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--muted);transition:left .2s var(--ease)}
.switch.on{background:rgba(63,169,255,.45)}
.switch.on::after{left:28px;background:#fff;box-shadow:0 0 8px var(--cyan)}
.warn{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border:1px solid rgba(255,211,107,.55);background:rgba(255,211,107,.06);border-radius:4px;font-size:14px;line-height:1.4}
.warn .ic{color:var(--gold);margin-top:1px}
.warn.danger{border-color:rgba(255,107,132,.6);background:rgba(255,107,132,.08)}
.warn.danger .ic{color:var(--danger)}

/* ---------- listas, histórico, estados vazios ---------- */
.loglist{list-style:none;padding:0;margin:4px 0 0}
.loglist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:15px}
.loglist li:last-child{border-bottom:0}
.l-ic{flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--inset);border:1px solid var(--line-soft);color:var(--cyan)}
.l-ic .ic{width:16px;height:16px}
.l-ic.ok{color:var(--green);border-color:rgba(95,227,154,.4)}
.l-txt{flex:1;min-width:0}
.loglist .t{font-family:var(--tech);font-size:12px;color:var(--muted);white-space:nowrap}
.empty{text-align:center;padding:18px 10px 8px;color:var(--muted);font-size:14px;line-height:1.45}
.empty-ic{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;border:1px dashed var(--line-mid);color:var(--cyan);background:radial-gradient(circle,rgba(63,169,255,.16),transparent 70%)}
.empty-ic .ic{width:28px;height:28px}
.empty b{display:block;font-size:17px;margin-bottom:4px}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cal-head .btn{flex:none;width:48px;padding:0}
.cal-month{font-family:var(--tech);font-size:14px;letter-spacing:.14em;color:#fff;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.cal .dow{text-align:center;font-size:12px;font-weight:700;color:var(--muted);font-family:var(--tech)}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;padding:0;border:1px solid var(--line-soft);border-radius:4px;background:var(--inset);font-size:15px;font-weight:700;color:var(--text);cursor:pointer;touch-action:manipulation}
.day.done{background:rgba(63,169,255,.32);border-color:var(--line);box-shadow:0 0 8px rgba(63,169,255,.45);color:#fff}
.day.busy{background:rgba(255,211,107,.16);border-color:var(--gold)}
.day.recovered{background:rgba(185,139,255,.22);border-color:var(--purple)}
.day.missed{color:var(--muted);opacity:.55}
.day.future,.day.before{opacity:.25;cursor:default}
.day.today{outline:2px solid var(--cyan);outline-offset:1px}
.day.sel{box-shadow:inset 0 0 0 2px #fff}
.gymdot{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;border:1px solid;border-radius:2px;vertical-align:-1px}
.status-chip{display:inline-flex;align-items:center;gap:6px;margin:2px 0 6px;padding:5px 10px;border:1px solid var(--line-soft);border-radius:14px;font-size:14px;font-weight:700;color:var(--muted)}
.status-chip .ic{width:16px;height:16px}
.status-chip.done{color:var(--cyan);border-color:var(--line-mid)}
.status-chip.busy{color:var(--gold);border-color:rgba(255,211,107,.5)}
.status-chip.recovered{color:var(--purple);border-color:rgba(185,139,255,.5)}
.status-chip.pending{color:var(--text)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles.two{grid-template-columns:1fr 1fr}
.rec{display:flex;flex-direction:column;gap:4px;padding:12px 10px;border:1px solid var(--line-soft);background:var(--inset);border-radius:4px;min-width:0}
.rec .k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rec .k .ic{width:16px;height:16px;color:var(--gold)}
.rec .v{font-family:var(--tech);font-size:20px;font-weight:700;color:#fff;white-space:nowrap}
.rec .v small{font-size:12px;color:var(--muted);margin-left:3px;font-weight:500}
.tiles .rec{align-items:center;text-align:center}
.set-row{display:flex;gap:8px;align-items:stretch}
.set-row .text-input{flex:1}
.set-row .btn{flex:none}

/* ---------- Dungeon (GPS) ---------- */
.live-banner{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;margin-top:12px;padding:10px 14px;border:1px solid var(--gold);border-radius:4px;background:rgba(255,211,107,.09);color:var(--gold);font-weight:700;font-size:15px;text-align:left;cursor:pointer;animation:pulseGold 1.8s ease-in-out infinite}
.live-banner .ic:last-child{margin-left:auto}
@keyframes pulseGold{50%{box-shadow:0 0 16px rgba(255,211,107,.45)}}
.gate{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;margin:22px 0 6px;padding:0;background:none;border:0;cursor:pointer;color:#fff;touch-action:manipulation}
.gate-orb{position:relative;width:136px;height:136px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent);
  background:radial-gradient(circle at 50% 45%, rgba(var(--accent-rgb),.6), #061532 60%, #020610 76%);
  box-shadow:0 0 30px rgba(var(--accent-rgb),.55), inset 0 0 30px rgba(var(--accent-rgb),.6);transition:transform .15s}
.gate-orb::before{content:'';position:absolute;inset:-11px;border-radius:50%;border:2px dashed rgba(var(--accent-rgb),.6);animation:spin 16s linear infinite}
.gate-orb::after{content:'';position:absolute;inset:-22px;border-radius:50%;border:1px solid rgba(var(--accent-rgb),.25);animation:spin 24s linear infinite reverse}
.gate-orb .ic{width:48px;height:48px;filter:drop-shadow(0 0 8px #fff)}
.gate:active .gate-orb{transform:scale(.94)}
.gate-label{font-family:var(--tech);font-weight:900;font-size:17px;letter-spacing:.14em;text-shadow:0 0 10px rgba(var(--accent-rgb),.9)}
@keyframes spin{to{transform:rotate(360deg)}}
.act-item{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;margin-top:8px;padding:10px 12px;text-align:left;border:1px solid var(--line-soft);background:var(--inset);border-radius:4px;color:var(--text);font-size:15px;cursor:pointer;touch-action:manipulation}
.act-item:active{background:rgba(63,169,255,.16)}
.act-ic{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line-mid);color:var(--cyan)}
.act-main{flex:1;min-width:0;line-height:1.3}
.act-main b{font-family:var(--tech);font-size:18px}
.act-side{flex:none;text-align:right;font-family:var(--tech);font-size:13px;color:var(--muted);line-height:1.5}
.act-item > .ic{color:var(--muted)}

.live{padding-top:14px}
.live-dist{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:8px}
.live-dist .v{font-family:var(--tech);font-weight:900;font-size:clamp(64px,22vw,96px);line-height:1;color:#fff;text-shadow:0 0 22px rgba(var(--accent-rgb),.7);font-variant-numeric:tabular-nums}
.live-dist .u{font-family:var(--tech);font-size:16px;font-weight:700;color:var(--muted);letter-spacing:.12em}
.live-time{text-align:center;font-family:var(--tech);font-weight:700;font-size:clamp(36px,12vw,48px);line-height:1.1;margin-top:6px;color:var(--cyan);font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(95,227,255,.5)}
.live-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border:1px solid var(--line-soft);background:var(--inset);border-radius:4px}
.tile .k{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--tech);font-weight:700;font-size:28px;color:#fff;font-variant-numeric:tabular-nums}
.tile .u{font-size:12px;color:var(--muted)}
.gps-bar{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
.sig{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:4px 10px;border:1px solid currentColor;border-radius:16px;background:rgba(0,0,0,.25);font-size:13px;font-weight:700;letter-spacing:.02em}
.sig .ic{width:15px;height:15px}
button.sig{min-height:44px;cursor:pointer;touch-action:manipulation}
.sig.good{color:var(--green)} .sig.mid{color:var(--gold)} .sig.bad{color:var(--danger)} .sig.off{color:var(--muted)}
.status-banner{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;margin-top:4px;padding:8px 10px;border:1px solid var(--gold);border-radius:4px;color:var(--gold);background:rgba(255,211,107,.07);font-family:var(--tech);font-size:12px;letter-spacing:.1em;line-height:1.45;animation:blinkSoft 1.6s ease-in-out infinite}
.status-banner .ic{width:16px;height:16px}
@keyframes blinkSoft{50%{opacity:.62}}
.controls{display:grid;gap:10px;margin-top:14px}
.btn.ctl{width:100%;min-height:76px;font-family:var(--tech);font-size:20px;letter-spacing:.12em}
.btn.ctl .ic{width:26px;height:26px}
.btn.ctl.pause{border-color:var(--gold);color:var(--gold);background:rgba(255,211,107,.10);box-shadow:0 0 16px rgba(255,211,107,.2)}
.hold{width:100%;min-height:56px;-webkit-touch-callout:none}
.hold.big{min-height:68px;font-size:17px}
.hold-fill{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,107,132,.25),rgba(255,107,132,.6));transform:scaleX(0);transform-origin:left;transition:transform .15s}
.hold.holding .hold-fill{transform:scaleX(1);transition:transform 1s linear}
.hold-label{position:relative;display:inline-flex;align-items:center;gap:8px}
.map-wrap{position:relative;isolation:isolate;margin-top:14px}
.map-wrap::after{content:'';position:absolute;inset:0;z-index:500;pointer-events:none;border-radius:4px;box-shadow:inset 0 0 40px rgba(2,8,20,.9)}
.map{height:34vh;min-height:220px;border:1px solid var(--line-mid);border-radius:4px;overflow:hidden;background:#06101f}
.map.small{height:240px;min-height:0}
.map-off{display:grid;place-items:center;height:100%;padding:20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.45}
.leaflet-container{background:#06101f;font-family:var(--ui)}
.leaflet-tile-pane{filter:invert(1) hue-rotate(200deg) brightness(.82) contrast(.92) saturate(.55)}
.leaflet-control-attribution{background:rgba(2,6,14,.82)!important;color:var(--muted)!important;font-size:12px!important}
.leaflet-control-attribution a{color:var(--cyan)!important}
.recenter{position:absolute;right:10px;bottom:30px;z-index:1000;width:48px;height:48px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:rgba(3,10,24,.92);color:var(--cyan);cursor:pointer;box-shadow:0 0 12px rgba(63,169,255,.5)}
.split-head,.split-row{display:grid;grid-template-columns:46px 1fr 64px;gap:10px;align-items:center}
.split-head{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:4px}
.split-row{min-height:38px;border-bottom:1px solid var(--line-soft)}
.split-row:last-child{border-bottom:0}
.split-row .km{font-family:var(--tech);font-size:14px;color:var(--muted)}

<script>
'use strict';
/* ==============================================================
   SISTEMA — app de treino estilo Solo Leveling
   --------------------------------------------------------------
   Seções:
     1. CONFIG .......... balanceamento do jogo (mexa aqui!)
     2. Utilitários ..... datas, números, RNG com semente
     3. Estado .......... load/save no localStorage
     4. Progressão ...... XP, nível, rank, atributos, sequência
     5. Missões ......... geração das diárias, semanais, penalidade
     6. Virada de dia ... fecha os dias passados e cria o de hoje
     7. Ações ........... o que acontece a cada toque
     8. Interface ....... renderização das 4 abas
     9. Notificações .... toasts, modais, animação de RANK UP
    10. Eventos, PWA e inicialização
    11. Dungeon ....... rastreamento por GPS (Leaflet + OpenStreetMap)
   ============================================================== */


/* ==============================================================
   1. CONFIG — todo o balanceamento fica aqui
   ============================================================== */
const CONFIG = {
  STORAGE_KEY: 'sistema_solo_v1',
  STAT_START: 10,                       // valor inicial de cada atributo

  // XP necessário para ir do nível L para o L+1 (L1=100, L5=300, L10=550...)
  xpToNext: L => 100 + 50 * (L - 1),

  // Rank desbloqueado a partir de cada nível
  RANKS: [
    { id: 'E', minLevel: 1,  color: '#9fb0c6' },
    { id: 'D', minLevel: 6,  color: '#5fe39a' },
    { id: 'C', minLevel: 11, color: '#3fa9ff' },
    { id: 'B', minLevel: 18, color: '#b98bff' },
    { id: 'A', minLevel: 26, color: '#ff9f43' },
    { id: 'S', minLevel: 36, color: '#ffd36b' },
  ],

  XP: {
    daily: 15,          // cada missão diária
    busy: 10,           // protocolo mínimo (dia corrido)
    penalty: 10,        // missão de penalidade
    dayBonus: 10,       // bônus ao completar o dia
    streakBonusMax: 10, // +1 XP por dia de sequência, até este limite
    gym: 40,            // treino de academia
    perKm: 6,           // registro manual: XP por km
    perMinute: 0.5,     // registro manual: XP por minuto
    logCap: 60,         // teto de XP por registro manual
    weekly: { km: 100, gym: 100, long: 80, active: 60 },
  },

  FREE_DAY_MULT: 1.5,   // dias livres: missões 1,5x maiores (e 3 em vez de 2)

  // Exercícios das missões diárias.
  // alvo = min(cap, base + per × (nível − 1)), multiplicado em dias livres.
  // secPer = segundos estimados por unidade (inclui descanso), só para mostrar "~X min".
  EXERCISES: {
    walk: {
      name: 'Caminhada', unit: 'km', stat: 'end', base: 0.8, per: 0.05, cap: 1.5, secPer: 720,
      hint: L => L < 9
        ? 'Vale o trajeto até o ponto de ônibus ou a pausa do almoço. Pode somar em partes.'
        : 'Pode somar em partes. Nesse nível, tente trotar trechos do caminho.',
    },
    squat:   { name: 'Agachamentos', unit: 'reps', stat: 'str', base: 15, per: 2, cap: 50, secPer: 6,
               hint: 'Pode dividir em séries ao longo do dia.' },
    pushup:  { name: L => (L < 10 ? 'Flexões (joelhos ou inclinada)' : 'Flexões'), unit: 'reps', stat: 'str',
               base: 6, per: 1, cap: 35, secPer: 8,
               hint: 'Inclinada = mãos apoiadas na mesa ou parede. Divida em séries.' },
    abs:     { name: 'Abdominais', unit: 'reps', stat: 'end', base: 12, per: 2, cap: 40, secPer: 5,
               hint: 'Abdominal curto (crunch) já vale.' },
    plank:   { name: 'Prancha', unit: 's', stat: 'end', base: 20, per: 3, cap: 90, secPer: 4,
               hint: 'Tempo total — pode somar várias pranchas curtas.' },
    jacks:   { name: 'Polichinelos', unit: 'reps', stat: 'agi', base: 30, per: 4, cap: 100, secPer: 1.5,
               hint: 'Pode trocar por corrida parada no lugar.' },
    stretch: { name: 'Alongamento / mobilidade', unit: 'min', stat: 'agi', base: 5, per: 0, cap: 5, secPer: 60,
               hint: 'Antes ou depois da academia.' },
  },

  // Exercícios de força sorteados (com semente da data) nos dias úteis/livres
  STRENGTH_POOL: ['squat', 'pushup', 'abs', 'plank', 'jacks'],

  // Progressão da corrida (sessão longa semanal), por faixa de nível
  CARDIO: [
    { min: 1,  max: 4,   minutes: 20, label: 'Caminhada contínua',   desc: '20 min de caminhada em ritmo confortável' },
    { min: 5,  max: 8,   minutes: 20, label: 'Caminhada + trote',    desc: '5× (1 min de trote leve + 3 min caminhando)' },
    { min: 9,  max: 12,  minutes: 24, label: 'Intervalado 2/2',      desc: '6× (2 min de trote + 2 min caminhando)' },
    { min: 13, max: 17,  minutes: 24, label: 'Intervalado 3/1',      desc: '6× (3 min de trote + 1 min caminhando)' },
    { min: 18, max: 22,  minutes: 20, label: 'Trote contínuo',       desc: '5 min caminhando + 15 min de trote sem parar' },
    { min: 23, max: 29,  minutes: 30, label: 'Corrida leve',         desc: '5 min caminhando + 25 min de corrida leve' },
    { min: 30, max: 35,  minutes: 35, label: 'Corrida',              desc: '35 min de corrida contínua' },
    { min: 36, max: 999, minutes: 45, label: 'Corrida longa',        desc: '45 min de corrida — ritmo de caçador rank S' },
  ],

  // Meta de km na semana (arredondada para 0,5)
  weeklyKm: L => Math.min(25, Math.round((5 + 0.4 * (L - 1)) * 2) / 2),

  // Quantos dias da semana cumprir a missão diária
  activeDaysTarget: L => (L < 10 ? 4 : 5),

  // Rastreamento por GPS (aba Dungeon)
  GPS: {
    MAX_ACCURACY: 25,       // m — leituras com precisão pior que isso são ignoradas
    MAX_SPEED: 10,          // m/s (36 km/h) — acima disso entre dois pontos é "salto" impossível
    JUMP_RESYNC: 5,         // após N saltos seguidos, realinha a posição (sem somar distância)
    MIN_STEP: 5,            // m — movimento mínimo para contar (filtra o "tremido" parado)
    AUTO_PAUSE_SEC: 8,      // s parado até a pausa automática
    PACE_WINDOW_MS: 30000,  // janela usada no "ritmo atual"
    SAVE_EVERY_MS: 5000,    // salva a dungeon em andamento a cada 5 s
    STALE_FIX_MS: 30000,    // sem leitura há 30 s → reinicia o watchPosition
    MIN_SAVE_M: 30,         // abaixo disso, oferece descartar ao finalizar
    ROUTE_MAX_POINTS: 600,  // pontos guardados por rota finalizada (economiza espaço)
  },
};

// Textos fixos
const STAT_NAMES   = { str: 'FORÇA', agi: 'AGILIDADE', end: 'RESISTÊNCIA', dis: 'DISCIPLINA' };
const UNIT_LABEL   = { reps: 'reps', s: 's', km: 'km', min: 'min', check: '' };
const DOW_SHORT    = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const MONTHS       = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DAYTYPE_LABEL = { normal: 'Dia útil', gym: 'Dia de academia', free: 'Dia livre' };
const ACTIVITIES = {
  walk:  { label: 'Caminhada',      icon: '🚶' },
  run:   { label: 'Corrida / trote', icon: '🏃' },
  gym:   { label: 'Academia',       icon: '🏋️' },
  other: { label: 'Outro treino',   icon: '✦' },
};
const WEEKLY_NAMES = { km: 'Distância semanal', gym: 'Treinos de academia', long: 'Sessão longa', active: 'Dias ativos' };
const WEEKLY_STAT  = { km: ['end', 2], gym: ['str', 2], long: ['agi', 2], active: ['dis', 2] };
const RANK_TEXT = {
  D: 'Você deixou de ser o mais fraco. O corpo começou a responder.',
  C: 'Seu fôlego mudou. O trote contínuo já está no horizonte.',
  B: 'Caçador de rank B. Poucos chegam aqui com constância.',
  A: 'Rank A. A disciplina virou parte de quem você é.',
  S: 'Rank S. Você se tornou o caçador que o Sistema previu.',
};


/* ==============================================================
   2. UTILITÁRIOS
   ============================================================== */
const pad    = n => String(n).padStart(2, '0');
const round1 = n => Math.round(n * 10) / 10;
const fmtNum = n => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const esc    = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const parseNum = s => { const n = parseFloat(String(s).trim().replace(',', '.')); return isFinite(n) ? n : null; };

// Datas sempre como string 'AAAA-MM-DD' no fuso local (comparáveis como texto)
function dateKey(d = new Date()) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(k, n) { const d = parseKey(k); d.setDate(d.getDate() + n); return dateKey(d); }
function weekday(k) { return parseKey(k).getDay(); }                       // 0 = domingo
function weekStart(k) { return addDays(k, -((weekday(k) + 6) % 7)); }      // semana começa na segunda
function daysLeftInWeek(k) { return 7 - ((weekday(k) + 6) % 7); }          // inclui hoje
function shortDate(k) { const d = parseKey(k); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; }

// Gerador aleatório com semente: o mesmo dia sempre gera as mesmas missões
function seededRng(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* ignora */ } }


/* ==============================================================
   3. ESTADO + PERSISTÊNCIA
   --------------------------------------------------------------
   state.days[data]  = { missions, busyMission, penalty, log, complete, status, ... }
   state.weeks[seg]  = { targets, claimed, longManual }
   O progresso semanal (km, academia...) é CALCULADO a partir dos
   logs dos dias, então nunca fica dessincronizado.
   ============================================================== */
function defaultState() {
  const s = CONFIG.STAT_START;
  return {
    version: 1,
    createdAt: dateKey(),
    onboarded: false,
    player: { name: 'Jogador', level: 1, xp: 0, totalXp: 0 },
    stats: { str: s, agi: s, end: s, dis: s },
    streak: { best: 0 },
    settings: { gymDays: [2, 4], freeDays: [0, 6], autoPause: true },   // academia ter/qui; livres sáb/dom
    days: {},
    weeks: {},
    activities: [],          // dungeons (GPS) finalizadas — as rotas ficam em ROUTES_KEY
    lastProcessed: null,
  };
}

// Junta o que foi salvo com os valores padrão (útil quando o app ganhar campos novos)
function migrate(s) {
  const d = defaultState();
  return {
    ...d, ...s,
    player:   { ...d.player,   ...(s.player   || {}) },
    stats:    { ...d.stats,    ...(s.stats    || {}) },
    streak:   { ...d.streak,   ...(s.streak   || {}) },
    settings: { ...d.settings, ...(s.settings || {}) },
    days: s.days || {}, weeks: s.weeks || {}, activities: s.activities || [],
  };
}

function load() {
  try {
    const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { /* storage indisponível ou corrompido */ }
  return defaultState();
}

let saveWarned = false;
function save() {
  try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state)); }
  catch (e) {
    if (!saveWarned) { saveWarned = true; toast('Não foi possível salvar neste navegador. Use o backup em Config.', 'danger'); }
  }
}

let state = load();

const getToday    = () => state.days[dateKey()];
const currentWeek = () => state.weeks[weekStart(dateKey())];


/* ==============================================================
   4. PROGRESSÃO — XP, nível, rank, atributos, sequência
   ============================================================== */
function rankFor(level) {
  let r = CONFIG.RANKS[0];
  for (const x of CONFIG.RANKS) if (level >= x.minLevel) r = x;
  return r;
}
function nextRank(level) { return CONFIG.RANKS.find(r => r.minLevel > level) || null; }

function addStat(stat, n) { state.stats[stat] = (state.stats[stat] || 0) + n; }

// Dá XP e enfileira as animações de LEVEL UP / RANK UP
function gainXp(amount) {
  amount = Math.round(amount);
  if (amount <= 0) return;
  const p = state.player;
  const before = p.level;
  const oldRank = rankFor(before);
  p.xp += amount;
  p.totalXp += amount;
  while (p.xp >= CONFIG.xpToNext(p.level)) { p.xp -= CONFIG.xpToNext(p.level); p.level++; }
  if (p.level > before) {
    queueBig({ type: 'level', level: p.level });
    const nr = rankFor(p.level);
    if (nr.id !== oldRank.id) queueBig({ type: 'rank', from: oldRank.id, to: nr.id, color: nr.color });
  }
}

// Status final de um dia (hoje é calculado ao vivo)
function dayStatus(k) {
  const d = state.days[k];
  if (!d) return null;
  if (k === dateKey()) return d.complete ? (d.mode === 'busy' ? 'busy' : 'done') : 'pending';
  return d.status;
}

/* Sequência de dias ativos.
   Contam: dia cumprido, dia corrido cumprido e dia "recuperado" pela penalidade.
   Se ontem foi perdido mas a penalidade de hoje ainda está pendente,
   a sequência fica "em risco" (não quebra até o dia acabar). */
function computeStreak() {
  const today = dateKey();
  const td = state.days[today];
  const yesterday = addDays(today, -1);
  let s = (td && td.complete) ? 1 : 0;
  let k = yesterday;
  while (state.days[k]) {
    const st = state.days[k].status;
    if (st === 'done' || st === 'busy' || st === 'recovered') s++;
    else if (st === 'missed' && k === yesterday && td && td.penalty && !td.penalty.done) { /* em risco: pula sem quebrar */ }
    else break;
    k = addDays(k, -1);
  }
  return s;
}


/* ==============================================================
   5. MISSÕES
   ============================================================== */
function exerciseTarget(kind, L, mult = 1) {
  const ex = CONFIG.EXERCISES[kind];
  const raw = Math.min(ex.cap, ex.base + ex.per * (L - 1)) * mult;
  return ex.unit === 'km' ? round1(raw) : Math.round(raw);
}

function cardioFor(L) {
  return CONFIG.CARDIO.find(c => L >= c.min && L <= c.max) || CONFIG.CARDIO[CONFIG.CARDIO.length - 1];
}

// Formato padrão de uma missão
function makeMission(k, kind, L, mult = 1) {
  const ex = CONFIG.EXERCISES[kind];
  return {
    id: `${k}-${kind}`, kind, tag: 'daily',
    name: typeof ex.name === 'function' ? ex.name(L) : ex.name,
    unit: ex.unit, target: exerciseTarget(kind, L, mult), progress: 0, done: false,
    stat: ex.stat, xp: CONFIG.XP.daily,
    hint: typeof ex.hint === 'function' ? ex.hint(L) : ex.hint,
  };
}

function gymMission(k) {
  return {
    id: `${k}-gym`, kind: 'gym', tag: 'daily', name: 'Treino de academia', unit: 'check',
    target: 1, progress: 0, done: false, stat: 'str', xp: CONFIG.XP.gym,
    hint: 'Marque quando terminar o treino. Conta também na missão semanal.',
  };
}

// Missões diárias: geradas uma vez por dia, com o nível daquele momento
function generateDaily(k, dayType, L) {
  if (dayType === 'gym') return [gymMission(k), makeMission(k, 'stretch', L)];
  const free = dayType === 'free';
  const mult = free ? CONFIG.FREE_DAY_MULT : 1;
  const strength = shuffle(CONFIG.STRENGTH_POOL, seededRng(k)).slice(0, free ? 2 : 1);
  return [makeMission(k, 'walk', L, mult), ...strength.map(kind => makeMission(k, kind, L, mult))];
}

// "Dia corrido": versão mínima de ~5 min
function busyMission(k, L) {
  return {
    id: `${k}-busy`, kind: 'busy', tag: 'busy', name: 'Protocolo Mínimo (~5 min)', unit: 'check',
    target: 1, progress: 0, done: false, stat: 'dis', xp: CONFIG.XP.busy,
    hint: `${Math.round(5 + L * 0.5)} agachamentos + ${15 + L}s de prancha + 2 min caminhando ou alongando.`,
  };
}

// Penalidade leve (+5 min) quando o dia anterior foi perdido
function penaltyMission(k, L, forDate) {
  return {
    id: `${k}-penalty`, kind: 'penalty', tag: 'penalty', name: 'Missão de Penalidade (+5 min)', unit: 'check',
    target: 1, progress: 0, done: false, stat: 'dis', xp: CONFIG.XP.penalty, forDate,
    hint: `Caminhar 5 min extras OU ${10 + L} polichinelos + ${8 + L} agachamentos. Cumpra hoje para salvar a sequência.`,
  };
}

// Missões semanais: metas travadas no nível de quando a semana começou
function generateWeek(start) {
  const L = state.player.level;
  const c = cardioFor(L);
  return {
    start, level: L, announced: false, longManual: false, claimed: {},
    targets: {
      km: CONFIG.weeklyKm(L),
      gym: state.settings.gymDays.length,
      longMin: c.minutes, longLabel: c.label, longDesc: c.desc,
      active: CONFIG.activeDaysTarget(L),
    },
  };
}

// Calcula o progresso semanal a partir dos registros dos 7 dias
function weekProgress(wk) {
  let km = 0, gym = 0, active = 0, long = wk.longManual;
  for (let i = 0; i < 7; i++) {
    const d = state.days[addDays(wk.start, i)];
    if (!d) continue;
    if (d.complete) active++;
    for (const e of d.log) {
      km += e.km || 0;
      if (e.type === 'gym') gym++;
      if ((e.type === 'walk' || e.type === 'run') && (e.minutes || 0) >= wk.targets.longMin) long = true;
    }
  }
  return { km: round1(km), gym, active, long: long ? 1 : 0 };
}

function activeMissions(d) { return d.mode === 'busy' ? [d.busyMission] : d.missions; }
function findMission(d, id) { return [...d.missions, d.busyMission, d.penalty].filter(Boolean).find(m => m.id === id); }

function estMinutes(m) {
  const ex = CONFIG.EXERCISES[m.kind];
  if (ex) return Math.max(1, Math.round(m.target * ex.secPer / 60));
  return (m.kind === 'busy' || m.kind === 'penalty') ? 5 : 0;
}


/* ==============================================================
   6. VIRADA DE DIA
   --------------------------------------------------------------
   Roda ao abrir o app, a cada 30 s e quando o app volta ao foco.
   Fecha todos os dias desde o último processado até ontem.
   ============================================================== */
function ensureToday() {
  const today = dateKey();
  if (state.lastProcessed && state.lastProcessed < today) {
    for (let k = state.lastProcessed; k < today; k = addDays(k, 1)) finalizeDay(k);
  }
  if (!state.days[today]) createDay(today);
  const ws = weekStart(today);
  if (!state.weeks[ws]) state.weeks[ws] = generateWeek(ws);
  state.lastProcessed = today;
  save();
}

function finalizeDay(k) {
  let d = state.days[k];
  if (!d) {
    // App não foi aberto nesse dia: fica registrado como não cumprido
    state.days[k] = { date: k, dayType: 'normal', mode: 'normal', missions: [], busyMission: null, penalty: null,
                      log: [], complete: false, status: 'missed', auto: true };
    return;
  }
  if (d.status) return;
  d.status = d.complete ? (d.mode === 'busy' ? 'busy' : 'done') : 'missed';
}

function createDay(k) {
  const s = state.settings, dow = weekday(k), L = state.player.level;
  const dayType = s.gymDays.includes(dow) ? 'gym' : (s.freeDays.includes(dow) ? 'free' : 'normal');
  const y = addDays(k, -1);
  const d = {
    date: k, level: L, dayType, mode: 'normal',
    missions: generateDaily(k, dayType, L), busyMission: null, penalty: null,
    log: [], complete: false, status: null, announced: false,
  };
  // Penalidade só se ONTEM foi perdido (nunca acumula)
  if (state.days[y] && state.days[y].status === 'missed') d.penalty = penaltyMission(k, L, y);
  state.days[k] = d;
}

function checkDayChange() {
  if (dateKey() !== state.lastProcessed) { ensureToday(); render(); announce(); }
}

// Avisos "[SISTEMA] Missão diária recebida" (uma vez por dia/semana)
function announce() {
  const d = getToday(), wk = currentWeek();
  let delay = 300;
  if (!d.announced) {
    d.announced = true;
    setTimeout(() => toast('Missão diária recebida.'), delay); delay += 700;
    if (d.penalty) { setTimeout(() => toast('Missão de Penalidade recebida. Cumpra hoje para preservar a sequência.', 'danger'), delay); delay += 700; }
  }
  if (!wk.announced) {
    wk.announced = true;
    setTimeout(() => toast('Novas missões semanais disponíveis.', 'gold'), delay);
  }
  save();
}

// Soma progresso numa missão (o "+ Parcial" e o "Concluir" passam por aqui)
function addProgress(id, amount) {
  const d = getToday();
  const m = findMission(d, id);
  if (!m || m.done || !(amount > 0)) return;
  m.progress = round1(m.progress + amount);
  d.log.push({
    t: Date.now(),
    type: m.kind === 'walk' ? 'walk' : (m.kind === 'gym' ? 'gym' : 'mission'),
    label: m.name, amount, unit: m.unit,
    km: m.unit === 'km' ? amount : 0, minutes: 0,
  });
  if (m.progress >= m.target - 1e-9) completeMission(d, m);
  else toast(`Progresso: ${m.name} ${fmtNum(m.progress)}/${fmtNum(m.target)} ${UNIT_LABEL[m.unit]}`);
  afterAction();
}

function completeById(id) {
  const m = findMission(getToday(), id);
  if (!m || m.done) return;
  addProgress(id, m.unit === 'check' ? 1 : round1(m.target - m.progress));
}

function completeMission(d, m) {
  m.done = true;
  m.progress = Math.max(m.progress, m.target);
  gainXp(m.xp);
  if (m.kind === 'gym') { addStat('str', 2); addStat('end', 1); }
  else addStat(m.stat, 1);
  toast(`Missão concluída: ${m.name}`, 'ok', `+${m.xp} XP`);
  vibrate(30);

  if (m.tag === 'penalty') {
    const missed = state.days[m.forDate];
    if (missed && missed.status === 'missed') missed.status = 'recovered';
    setTimeout(() => toast('Penalidade cumprida. Sequência preservada.', 'gold'), 500);
  } else {
    checkDayComplete(d);
  }
}

function checkDayComplete(d) {
  if (d.complete) return;
  const list = activeMissions(d);
  if (!list.length || !list.every(m => m.done)) return;
  d.complete = true;
  const streak = computeStreak();
  const bonus = CONFIG.XP.dayBonus + Math.min(streak, CONFIG.XP.streakBonusMax);
  gainXp(bonus);
  addStat('dis', 1);
  setTimeout(() => toast(d.mode === 'busy' ? 'Protocolo mínimo cumprido. Sequência mantida.' : 'Todas as missões diárias concluídas.', 'ok', `+${bonus} XP`), 450);
  if (streak > 0 && streak % 7 === 0) {
    addStat('dis', 2);
    setTimeout(() => toast(`Sequência de ${streak} dias! Disciplina +2.`, 'gold'), 900);
  }
}

// Confere metas semanais e dá a recompensa uma única vez
function checkWeekly() {
  const wk = currentWeek();
  if (!wk) return;
  const p = weekProgress(wk), t = wk.targets;
  const reached = { km: p.km >= t.km, gym: t.gym > 0 && p.gym >= t.gym, long: p.long >= 1, active: p.active >= t.active };
  let delay = 700;
  for (const key of Object.keys(reached)) {
    if (reached[key] && !wk.claimed[key]) {
      wk.claimed[key] = true;
      const xp = CONFIG.XP.weekly[key];
      gainXp(xp);
      addStat(...WEEKLY_STAT[key]);
      setTimeout(() => toast(`Missão semanal concluída: ${WEEKLY_NAMES[key]}`, 'gold', `+${xp} XP`), delay);
      delay += 500;
    }
  }
}

// Botão "Dia corrido"
function setBusy(on) {
  const d = getToday();
  if (on) {
    if (d.complete) return;
    if (!d.busyMission) d.busyMission = busyMission(d.date, d.level || state.player.level);
    d.mode = 'busy';
    toast('Modo Dia Corrido ativado. Missão reduzida para manter a sequência.', 'gold');
  } else {
    if (d.busyMission && d.busyMission.done) return;
    d.mode = 'normal';
    toast('Missões normais restauradas.');
  }
  afterAction();
}

// Registro manual (aba Registrar)
// opts: { label, gps, activityId, silent } — usado pela Dungeon (GPS)
function logActivity(type, minutes, km, opts = {}) {
  const d = getToday();
  const entry = { t: Date.now(), type, label: opts.label || ACTIVITIES[type].label, minutes, km };
  if (opts.gps) { entry.gps = true; entry.activityId = opts.activityId; }
  d.log.push(entry);
  let xp = 0;

  if (type === 'gym') {
    // Se hoje tem a missão de academia, o registro conclui a missão
    const gm = d.mode === 'normal' && d.missions.find(m => m.kind === 'gym' && !m.done);
    if (gm) { gm.progress = 1; completeMission(d, gm); }
    else { xp = CONFIG.XP.gym; addStat('str', 2); addStat('end', 1); }
  } else {
    xp = Math.min(CONFIG.XP.logCap, km * CONFIG.XP.perKm + minutes * CONFIG.XP.perMinute);
    if (type === 'run') { addStat('agi', 1); addStat('end', 1); }
    else addStat('end', 1);
    // km caminhados/corridos também contam para a caminhada diária
    if (km > 0 && (type === 'walk' || type === 'run') && d.mode === 'normal') {
      const wm = d.missions.find(m => m.kind === 'walk' && !m.done);
      if (wm) { wm.progress = round1(wm.progress + km); if (wm.progress >= wm.target - 1e-9) completeMission(d, wm); }
    }
  }
  if (xp > 0) { gainXp(xp); if (!opts.silent) toast(`Atividade registrada: ${describeLog(entry)}`, 'ok', `+${Math.round(xp)} XP`); }
  afterAction();
}

// Depois de qualquer ação: semanais, recorde, salvar, redesenhar, animações
function afterAction() {
  checkWeekly();
  const s = computeStreak();
  if (s > state.streak.best) state.streak.best = s;
  save();
  render();
  setTimeout(flushBig, 500);
}

/* ---------- efeitos de feedback (não mexem na lógica) ---------- */
let lastTab = null;
let lastXpTotal = null;        // XP total no render anterior → "+XP" flutuante
let lastRingPct = null, lastRingLevel = null;
let seenDone = null;           // missões concluídas no render anterior
let freshDone = new Set();     // concluídas desde o render anterior → animação
let lastTap = null;            // onde foi o último toque (origem do "+XP")

document.addEventListener('pointerdown', e => { lastTap = { x: e.clientX, y: e.clientY, t: Date.now() }; }, { capture: true, passive: true });

function computeFreshDone() {
  const d = state.days[dateKey()], wk = currentWeek();
  const ids = new Set();
  if (d) [...d.missions, d.busyMission, d.penalty].filter(Boolean).forEach(m => { if (m.done) ids.add(m.id); });
  if (wk) Object.keys(wk.claimed).forEach(k => { if (wk.claimed[k]) ids.add(`w-${wk.start}-${k}`); });
  freshDone = new Set(seenDone ? [...ids].filter(i => !seenDone.has(i)) : []);
  seenDone = ids;
}

function spawnXpFloat(text) {
  const el = document.createElement('div');
  el.className = 'xp-float';
  el.textContent = text;
  const recent = lastTap && Date.now() - lastTap.t < 5000 && lastTap.x !== undefined;
  const x = recent ? lastTap.x : window.innerWidth / 2;
  const y = recent ? lastTap.y : window.innerHeight * 0.35;
  el.style.left = Math.min(window.innerWidth - 60, Math.max(60, x)) + 'px';
  el.style.top = Math.max(90, y) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1400);
}
function xpFeedback() {
  const total = state.player.totalXp;
  const diff = lastXpTotal === null ? 0 : total - lastXpTotal;
  if (diff > 0 && diff <= 600) spawnXpFloat(`+${diff} XP`);
  lastXpTotal = total;
}

// Anel de XP: anima do valor anterior até o atual
function animateXpRing() {
  const fg = view.querySelector('.ring-fg');
  if (!fg) return;
  const p = state.player;
  const pct = Math.min(1, p.xp / CONFIG.xpToNext(p.level));
  const C = Number(fg.dataset.c);
  const from = lastRingPct === null ? pct : (p.level > lastRingLevel ? 0 : lastRingPct);
  fg.style.transition = 'none';
  fg.style.strokeDashoffset = (C * (1 - from)).toFixed(2);
  fg.getBoundingClientRect();
  fg.style.transition = '';
  fg.style.strokeDashoffset = (C * (1 - pct)).toFixed(2);
  lastRingPct = pct; lastRingLevel = p.level;
}

  const nav = document.getElementById('nav');

      ? `<button data-act="tab" data-tab="gps" class="nav-dungeon" aria-label="${label}"><span class="portal">${icon(ic)}</span><span>${label}</span></button>`
      : `<button data-act="tab" data-tab="${tab}" aria-label="${label}">${icon(ic)}<span>${label}</span></button>`).join('');
    nav.dataset.built = '1';
  }
  nav.querySelectorAll('button').forEach(b => {
    const on = b.dataset.tab === currentTab;
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  nav.querySelector('.nav-dungeon').classList.toggle('live', !!gpsLive);
}

function render() {
  const t = new Date();
  const rank = rankFor(state.player.level);
  document.documentElement.dataset.rank = rank.id;          // tema por rank
  document.getElementById('topdate').textContent = `${DOW_SHORT[t.getDay()].toUpperCase()} ${pad(t.getDate())}/${pad(t.getMonth() + 1)}`;
  document.getElementById('toprank').textContent = `RANK ${rank.id} · NV ${state.player.level}`;
  renderNav();
  computeFreshDone();

  // animação de entrada só quando a aba muda
  const tabChanged = currentTab !== lastTab;

  else if (currentTab === 'gps') view.innerHTML = renderGps();
  else if (currentTab === 'log') view.innerHTML = renderLog();
  else if (currentTab === 'history') view.innerHTML = renderHistory();
  else view.innerHTML = renderSettings();
  if (gpsLive && currentTab !== 'gps') view.insertAdjacentHTML('afterbegin', liveBannerHtml());
  afterRenderGps();
  animateXpRing();
  xpFeedback();
}

function renderDailyPanel(d) {
  const list = activeMissions(d);
  const doneN = list.filter(m => m.done).length;
  const est = list.reduce((a, m) => a + estMinutes(m), 0);
  const title = d.mode === 'busy' ? 'Dia corrido' : DAYTYPE_LABEL[d.dayType];
  const meta = d.mode === 'busy' ? '~5 min' : (d.dayType === 'gym' ? 'treino + 5 min' : `~${est} min`);

  let footer = '';
  if (d.complete) footer = `<div class="complete-banner">${icon('check')} MISSÃO DIÁRIA CUMPRIDA · SEQUÊNCIA MANTIDA</div>`;
  else if (d.mode === 'normal') footer = `<button class="btn gold block" data-act="busy-on">${icon('bolt')} Dia corrido — versão de 5 min</button>`;
  else if (!d.busyMission.done) footer = `<button class="btn ghost block" data-act="busy-off">${icon('undo')} Voltar às missões normais</button>`;

  return `
  <section class="panel hero ${d.complete ? 'is-complete' : ''}">
    <header class="phead">
      <div><div class="eyebrow">${icon('target')} MISSÃO DIÁRIA</div><h2 class="ptitle-lg">${title}</h2></div>
      <div class="phead-meta"><b>${doneN}/${list.length}</b><span>${meta}</span></div>
    </header>
    <div class="segs">${list.map(m => `<i class="${m.done ? 'on' : ''}"></i>`).join('')}</div>
    ${d.penalty ? missionCard(d.penalty) : ''}
    ${list.map(missionCard).join('')}
    ${footer}
  </section>`;
}

function missionCard(m) {
  const unit = UNIT_LABEL[m.unit];
  const pct = Math.min(100, m.progress / m.target * 100);
  const color = m.tag === 'penalty' ? 'var(--danger)' : m.tag === 'busy' ? 'var(--gold)' : (STAT_COLOR[m.stat] || 'var(--line)');
  const tag = m.tag === 'penalty' ? '<span class="m-tag danger">PENALIDADE</span>'
            : m.tag === 'busy' ? '<span class="m-tag gold">MÍNIMO</span>' : '';
  const fresh = freshDone.has(m.id) ? 'just-done' : '';

  if (m.done) {
    return `
    <div class="mission done ${m.tag} ${fresh}" style="--mc:${color}">
      <div class="m-row">
        <span class="m-ic">${icon('check')}</span>
        <div class="m-main"><div class="m-name">${tag}${esc(m.name)}</div></div>
        <span class="xp-chip">+${m.xp} XP</span>
      </div>
    </div>`;
  }
  const val = m.unit === 'check' ? '' : `<span class="m-val"><b>${fmtNum(m.progress)}</b> / ${fmtNum(m.target)} ${unit}</span>`;
  const actions = m.unit === 'check'
    ? `<button class="btn primary block" data-act="complete" data-id="${m.id}">${icon('check')} Concluir</button>`
    : `<div class="m-actions">
         <button class="btn" data-act="partial" data-id="${m.id}">${icon('plus')} Parcial</button>
         <button class="btn primary" data-act="complete" data-id="${m.id}">${icon('check')} Concluir</button>
       </div>`;
  return `
  <div class="mission ${m.tag}" style="--mc:${color}">
    <div class="m-row">
      <span class="m-ic">${icon(KIND_ICON[m.kind] || 'target')}</span>
      <div class="m-main">
        <div class="m-head"><div class="m-name">${tag}${esc(m.name)}</div>${val}</div>
        ${m.hint ? `<div class="m-hint">${esc(m.hint)}</div>` : ''}
      </div>
    </div>
    ${m.unit !== 'check' ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}
    ${actions}
  </div>`;
}

// Atributos: gráfico radar (SVG) + barras
function renderStatsPanel() {
  const keys = ['str', 'agi', 'end', 'dis'];
  const labels = ['FOR', 'AGI', 'RES', 'DIS'];
  const maxV = Math.max(...keys.map(k => state.stats[k]));
  const scale = Math.max(15, Math.ceil(maxV * 1.3 / 5) * 5);   // escala do radar: o maior atributo fica a ~75%
  const cx = 80, cy = 80, R = 50, ang = [-90, 0, 90, 180].map(a => a * Math.PI / 180);
  const pt = (i, f) => [cx + Math.cos(ang[i]) * R * f, cy + Math.sin(ang[i]) * R * f];
  const poly = f => keys.map((_, i) => pt(i, f).map(n => n.toFixed(1)).join(',')).join(' ');
  const shape = keys.map((k, i) => pt(i, Math.min(1, state.stats[k] / scale)).map(n => n.toFixed(1)).join(',')).join(' ');
  const svg = `
    <svg class="radar" viewBox="0 0 160 160" role="img" aria-label="Gráfico dos atributos">
      ${[0.25, 0.5, 0.75, 1].map(f => `<polygon class="grid" points="${poly(f)}"/>`).join('')}
      ${keys.map((_, i) => { const [x, y] = pt(i, 1); return `<line class="axis" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }).join('')}
      <polygon class="shape" points="${shape}"/>
      ${keys.map((k, i) => { const [x, y] = pt(i, Math.min(1, state.stats[k] / scale)); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${STAT_COLOR[k]}"/>`; }).join('')}
      ${labels.map((l, i) => { const [x, y] = pt(i, 1.3); return `<text class="lbl" x="${x.toFixed(1)}" y="${y.toFixed(1)}">${l}</text>`; }).join('')}
    </svg>`;
  const list = keys.map(k => `
    <div class="attr" style="--sc:${STAT_COLOR[k]}">
      <div class="attr-top">${icon(STAT_ICON[k])}<span class="attr-name">${STAT_NAMES[k]}</span><b>${state.stats[k]}</b></div>
      <div class="bar"><i style="width:${Math.min(100, state.stats[k] / scale * 100)}%"></i></div>
    </div>`).join('');
  return `
  <section class="panel">
    <header class="phead"><div><div class="eyebrow">${icon('gauge')} ATRIBUTOS</div></div></header>
    <div class="attrs">${svg}<div>${list}</div></div>
  </section>`;
}

  if (e.type === 'mission' || ((e.type === 'walk' || e.type === 'gym') && e.amount !== undefined)) {
    return e.unit === 'check' ? e.label : `${e.label}: ${fmtNum(e.amount)} ${UNIT_LABEL[e.unit]}`;

  const parts = [];
  if (e.minutes) parts.push(`${fmtNum(e.minutes)} min`);
  if (e.km) parts.push(`${fmtNum(e.km)} km`);
  return `${e.label}${parts.length ? ' · ' + parts.join(' · ') : ''}`;

const modal = document.getElementById('modal');

/* Notificação "[SISTEMA]": a janela abre de uma linha e o texto é digitado.
   Fica no topo (abaixo do cabeçalho), longe dos botões principais. */
const TOAST_ICON = { info: 'info', ok: 'check', danger: 'alert', gold: 'spark' };
function toast(msg, kind = 'info', extra = '') {
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.setAttribute('role', 'status');
  el.setAttribute('aria-label', `Sistema: ${msg}${extra ? ' ' + extra : ''}`);
  el.innerHTML = `<div class="t-head" aria-hidden="true">${icon(TOAST_ICON[kind] || 'info')}<span>SISTEMA</span>${extra ? `<b class="t-extra">${esc(extra)}</b>` : ''}</div><div class="t-body" aria-hidden="true"></div>`;
  wrap.appendChild(el);
  while (wrap.children.length > 2) wrap.firstChild.remove();
  typeText(el.querySelector('.t-body'), msg);
  const life = 2600 + Math.min(2000, msg.length * 25);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, life);
}
function typeText(el, text) {
  if (REDUCED_MOTION) { el.textContent = text; return; }
  el.innerHTML = '<span class="tt"></span><span class="caret"></span>';
  const tt = el.firstChild;
  let i = 0;
  const step = () => {
    i = Math.min(text.length, i + 2);
    tt.textContent = text.slice(0, i);
    if (i < text.length) setTimeout(step, 16);
    else setTimeout(() => { const c = el.querySelector('.caret'); if (c) c.remove(); }, 450);
  };
  setTimeout(step, 200);
}

function openModal(html) {
  modalBox.innerHTML = html;
  modalBox.onclick = null;
  modal.classList.remove('hidden');
}
function closeModal() {
  modal.classList.add('hidden');
  modalBox.innerHTML = '';
  setTimeout(flushBig, 150);
}

// Pede um número (usado no "+ Parcial")
function askNumber({ title, sub = '', unit, quick }) {
  return new Promise(resolve => {
    openModal(`
      <div class="sys-head">${icon('info')} SISTEMA</div>
      <h3>${esc(title)}</h3>
      ${sub ? `<p class="small">${esc(sub)}</p>` : ''}
      <input class="num-input" id="num" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Quantidade em ${esc(unit)}">
      <p class="small" style="margin:6px 0 0">${esc(unit)}</p>
      <div class="quick">${quick.map(q => `<button class="btn" data-m="q" data-v="${q}">+${fmtNum(q)}</button>`).join('')}</div>
      <div class="m-actions" style="grid-template-columns:1fr 1.4fr">
        <button class="btn ghost" data-m="cancel">Cancelar</button>
        <button class="btn primary" data-m="ok">${icon('check')} Registrar</button>
      </div>`);
    const inp = modalBox.querySelector('#num');
    setTimeout(() => inp.focus(), 60);
    const finish = v => { closeModal(); resolve(v); };
    modalBox.onclick = e => {
      const b = e.target.closest('[data-m]');
      if (!b) return;
      if (b.dataset.m === 'q') inp.value = String(round1((parseNum(inp.value) || 0) + Number(b.dataset.v))).replace('.', ',');
      else if (b.dataset.m === 'cancel') finish(null);
      else finish(parseNum(inp.value));
    };

}

  el.style.setProperty('--cr', color);
  el.style.setProperty('--cr-rgb', hexToRgb(color));

/* Botão "segure para finalizar": precisa manter pressionado por 1 s.
   Um toque rápido só mostra a dica (evita finalizar sem querer correndo). */
const HOLD_MS = 1000;
const HOLD_ACTIONS = { 'gps-finish': () => finishDungeon(true) };
let holdEl = null, holdTimer = null, holdStart = 0;
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-hold]');
  if (!el) return;
  holdEl = el; holdStart = Date.now();
  el.classList.add('holding');
  vibrate(15);
  holdTimer = setTimeout(() => {
    const action = HOLD_ACTIONS[el.dataset.hold];
    endHold(true);
    vibrate([40, 40, 80]);
    if (action) action();
  }, HOLD_MS);
});
function endHold(completed) {
  if (!holdEl) return;
  clearTimeout(holdTimer);
  holdEl.classList.remove('holding');
  if (!completed && Date.now() - holdStart < 350) toast('Segure o botão por 1 segundo para finalizar.');
  holdEl = null;
}
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => endHold(false), true));
document.addEventListener('pointerleave', e => { if (holdEl && e.target === holdEl) endHold(false); }, true);
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('[data-hold]')) e.preventDefault(); });
// Teclado: Enter/Espaço no botão abre a confirmação normal
document.addEventListener('keydown', e => {

// Um único listener para todos os botões com data-act
document.addEventListener('click', async ev => {

  const act = el.dataset.act, id = el.dataset.id;

  switch (act) {
    case 'tab':

      if (currentTab === 'history') { selDate = dateKey(); calCursor = selDate.slice(0, 7); }
      if (currentTab === 'gps') { if (!gpsLive) gpsView = 'home'; gpsJustFinished = false; checkGpsPermission(); }

    case 'complete': completeById(id); break;

    case 'partial': {
      const m = findMission(getToday(), id);
      if (!m) break;
      const v = await askNumber({
        title: m.name, unit: UNIT_LABEL[m.unit],

        quick: QUICK[m.unit] || [1, 5, 10],
      });
